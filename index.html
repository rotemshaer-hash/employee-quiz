<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>מבחן עובדים</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin>
<style>
  :root{
    --bg:#f0f0f6; --top:#ffffff; --ink:#111; --muted:#777; --box:#7a7a7a;
    --purple:#7458c4; --soft:#ece8f8; --icon:#9a9a9a; --line:#d4d4da; --bad:#d23c3c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);font:16px/1.4 Arial,Helvetica,sans-serif;color:var(--ink)}
  button{font:inherit;cursor:pointer}

  .topbar{position:sticky;top:0;z-index:5;background:var(--top);display:flex;align-items:center;gap:10px;
          padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
  .avatar svg{width:22px;height:22px;fill:var(--purple)}
  .brand{font-weight:700;font-size:20px;color:#666;flex:none}
  .sep{width:1px;height:28px;background:#ddd;flex:none}
  .sub{color:#999;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

  main{max-width:720px;margin:0 auto}
  .panel{margin:0 12px;border-inline:1px solid var(--line);min-height:calc(100vh - 64px);padding:20px 10px 40px}
  h1{font-size:24px;margin:0 0 16px;line-height:1.5}
  h1 .ch{font-weight:400;margin:0 6px}
  .steps{display:flex;gap:5px;margin-bottom:16px}
  .steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}
  .steps i.on{background:var(--purple)}
  .muted{color:var(--muted);font-size:15px}

  .row{display:flex;flex-direction:row-reverse;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer}
  .box{flex:1;min-width:0;border:3px solid var(--box);border-radius:9px;padding:11px 12px;font-size:18px;min-height:50px;
       display:flex;align-items:center;background:var(--bg)}
  .row:has(input:checked) .box{border-color:var(--purple)}
  .row input{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:3px solid var(--box);border-radius:50%;margin:0;flex:none}
  .row input:checked{border-color:var(--purple);box-shadow:inset 0 0 0 4px var(--bg),inset 0 0 0 12px var(--purple)}
  .q{margin-bottom:22px;border-radius:9px}
  .q > p{font-weight:700;margin:0 0 8px;font-size:17px}
  .q > p small{display:block;font-weight:400;color:var(--muted);font-size:13px}
  .q.missing{outline:3px solid var(--bad);outline-offset:6px}
  .q img{max-width:100%;border-radius:9px;margin:0 0 10px;display:block}
  .field{width:100%;font:inherit;font-size:18px;border:3px solid var(--box);border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink)}
  .field:focus{outline:0;border-color:var(--purple)}
  textarea.field{min-height:100px;resize:vertical}

  .video{position:relative;border:3px solid var(--box);border-radius:9px;overflow:hidden;background:#000;aspect-ratio:16/9}
  .video.tall{aspect-ratio:9/16;max-height:70vh;margin:0 auto}
  .video video,.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
  .vname{font-weight:700;font-size:17px;margin:12px 0 0}
  .ask{font-weight:700;text-align:center;margin:14px 0 2px;min-height:1.4em}

  .btn{display:block;width:100%;background:var(--purple);color:#fff;border:3px solid var(--purple);border-radius:9px;
       padding:11px;font-size:18px;font-weight:700;text-align:center;margin-top:8px}
  .btn.ghost{background:transparent;color:var(--purple)}
  .btn:disabled{opacity:.5;cursor:default}
  .err{color:var(--bad);font-weight:700;margin:10px 0 0}
  .done{text-align:center;padding-top:30px}
  .tick{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;background:var(--purple);color:#fff;
        display:grid;place-items:center;font-size:38px}
  .tick.gray{background:var(--box)}
  .hidden{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-9 2-9 5v3h18v-3c0-3-5-5-9-5z"/></symbol>
</svg>
<div class="topbar">
  <div class="avatar"><svg><use href="#i-user"/></svg></div>
  <div class="brand">מבנים</div>
  <div class="sep"></div>
  <div class="sub" id="title">מבחן עובדים</div>
</div>
<main><div class="panel">
  <section id="s-name">
    <h1>ברוך הבא</h1>
    <p class="muted" id="intro">תצפה בסרטונים ותענה על השאלות לפי הסדר. אם משהו לא ברור — אפשר לצפות שוב.</p>
    <input class="field" id="name" type="text" placeholder="שם מלא" autocomplete="name">
    <button class="btn" id="start" disabled>התחלה</button>
  </section>

  <section id="s-video" class="hidden">
    <div class="steps" id="steps1"></div>
    <h1 id="vcrumb"></h1>
    <div class="video" id="vbox"></div>
    <p class="vname" id="vname"></p>
    <p class="ask" id="vask"></p>
    <button class="btn" id="vdone">הבנתי — המשך</button>
    <button class="btn ghost" id="vagain">לא הבנתי — לצפות שוב</button>
  </section>

  <section id="s-quiz" class="hidden">
    <div class="steps" id="steps2"></div>
    <h1>שאלות</h1>
    <form id="quiz"></form>
    <p class="err" id="qerr"></p>
    <button class="btn" id="send">המשך</button>
  </section>

  <section id="s-bad" class="done hidden">
    <div class="tick gray">?</div><h1>הקישור לא תקין</h1><p class="muted">בקש מהמנהל קישור חדש.</p>
  </section>
  <section id="s-used" class="done hidden">
    <div class="tick gray">!</div><h1>הקישור כבר נוצל</h1><p class="muted" id="usedBy"></p>
  </section>
  <section id="s-done" class="done hidden">
    <div class="tick">✓</div><h1>תודה! ההגשה נקלטה</h1><p class="muted" id="doneNote">אפשר לסגור את הדף.</p>
  </section>
</div></main>

<script src="settings.js?v=41"></script>
<script src="demo.js?v=41"></script>
<script>
const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll('.panel > section').forEach(s => s.classList.add('hidden')); $(id).classList.remove('hidden'); scrollTo(0, 0); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nameKey = n => n.trim().replace(/\s+/g, ' ').toLowerCase().replace(/[.$#\[\]/]/g, '_');
const DB = path => SETTINGS.databaseURL + path + '.json';

let PKG = [];                // המבחנים בקישור (אחד, או כמה בחבילה)
let code = null, bundleId = null, resultsEmail = '';
let steps = [], si = 0;      // שלב = סרטון אחד, או רצף שאלות ברצף אחד
const views = {}, answers = {};
let startedAt = null;

const lockUrl = () => bundleId ? DB('/bundles/' + encodeURIComponent(bundleId))
                               : DB('/invites/' + PKG[0].id + '/' + encodeURIComponent(code));
const subKeyFor = name => bundleId ? 'b_' + bundleId : (code ? 'c_' + code : nameKey(name));
const DONE_KEY = n => 'done-' + (bundleId || PKG[0].id) + '-' + nameKey(n);

// מבחן חדש = רשימת פריטים מסודרת. מבחן ישן (נושאים) מומר לאותה רשימה.
function toItems(q) {
  if (Array.isArray(q.items)) return q.items.map((it, i) => Object.assign({ key: it.key || 'i' + i }, it));
  let topics = q.topics || (q.videos || []).map(v => ({ name: v.title || 'נושא', videos: [v], questions: [] }));
  if ((q.questions || []).length) topics = topics.concat([{ name: '', videos: [], questions: q.questions }]);
  const cat = (q.category || '').trim() || q.title || '';
  const vids = [], qs = [];
  const out = [];
  topics.forEach((t, ti) => {
    const v = (t.videos || []).map((x, vi) => ({ key: 'v' + ti + '_' + vi, k: 'v', title: x.title || t.name, url: x.url,
                                                minSeconds: x.minSeconds, cat, sub: t.name || '' }));
    const s = (t.questions || []).map((x, qi) => Object.assign({ key: 'q' + ti + '_' + qi, k: 'q', cat, sub: t.name || '' }, x));
    if (q.qMode === 'topic') out.push(...v, ...s); else { vids.push(...v); qs.push(...s); }
  });
  return q.qMode === 'topic' ? out : vids.concat(qs);
}

(async () => {
  try {
    const qs = new URLSearchParams(location.search);
    const short = qs.get('q');
    bundleId = qs.get('b');
    let ids = [];
    if (bundleId) {
      if (!/^[\w-]+$/.test(bundleId)) throw 0;
      const bun = await (await fetch(DB('/bundles/' + bundleId), { cache: 'no-store' })).json();
      if (!bun || !(bun.quizzes || []).length) return show('s-bad');
      if (bun.used) return usedScreen(bun.name);
      ids = bun.quizzes;
    } else {
      let id;
      if (short) { const p = short.split('-'); id = p[0]; code = p[1] || null; }
      else { id = qs.get('t'); code = qs.get('c'); }
      if (!/^[\w-]+$/.test(id || '')) throw 0;
      if (code && !/^[\w-]+$/.test(code)) { code = null; return show('s-bad'); }
      ids = [id];
    }
    for (const id of ids) {
      const q = await (await fetch(DB('/quizzes/' + id), { cache: 'no-store' })).json();
      if (!q) continue;
      q.id = id;
      if (q.master) {   // מבחן מאסטר ישן: הנושאים מחושבים מכל המבחנים באותה קטגוריה
        const all = (await (await fetch(DB('/quizzes'), { cache: 'no-store' })).json()) || {};
        q.topics = [];
        Object.keys(all).forEach(oid => {
          const sib = all[oid];
          if (oid === id || !sib || sib.master || (sib.category || '').trim() !== (q.category || '').trim()) return;
          (sib.topics || []).forEach(t => q.topics.push(t));
        });
      }
      q.list = toItems(q);
      if (q.list.some(it => it.k === 'q')) PKG.push(q);
    }
    if (!PKG.length) throw 0;
    resultsEmail = PKG[0].email || (await (await fetch(DB('/settings/resultsEmail'), { cache: 'no-store' })).json()) || PKG[0].resultsEmail || '';

    const title = PKG.length > 1 ? PKG.length + ' מבחנים' : PKG[0].title;
    document.title = title; $('title').textContent = title;
    if (PKG.length > 1) $('intro').textContent = 'יש כאן ' + PKG.length + ' מבחנים ברצף. בסוף הכול נשלח יחד.';
    $('name').dispatchEvent(new Event('input'));

    if (code) {
      const inv = await (await fetch(lockUrl(), { cache: 'no-store' })).json();
      if (!inv) return show('s-bad');
      if (inv.for) { $('name').value = inv.for; $('name').dispatchEvent(new Event('input')); }
      if (inv.used) return usedScreen(inv.name);
    }
  } catch (e) {
    if (code || bundleId) return show('s-bad');
    $('s-name').innerHTML = '<h1>המבחן עדיין לא מוכן</h1><p class="muted">נסה שוב מאוחר יותר.</p>';
  }
})();

function usedScreen(who) {
  $('usedBy').textContent = 'הקישור הזה כבר שימש להגשה' + (who ? ' של ' + who : '') + '. אם צריך לבצע שוב, פנה למנהל.';
  show('s-used');
}

// ---------- שם ----------
$('name').addEventListener('input', () => { $('start').disabled = !PKG.length || $('name').value.trim().length < 2; });
$('start').onclick = async () => {
  const who = $('name').value;
  $('start').disabled = true; $('start').textContent = 'בודק...';
  if (code || bundleId) {
    const lock = await (await fetch(lockUrl(), { cache: 'no-store' })).json().catch(() => null);
    if (lock && lock.used) return usedScreen(lock.name);
  } else {
    try {
      const res = await fetch(DB('/done/' + PKG[0].id + '/' + encodeURIComponent(nameKey(who))), { cache: 'no-store' });
      if (!res.ok) throw 0;
      if ((await res.json()) !== null) return usedScreen(who);
      try { localStorage.removeItem(DONE_KEY(who)); } catch (e) {}
    } catch (e) {
      try { if (localStorage.getItem(DONE_KEY(who))) return usedScreen(who); } catch (e2) {}
    }
  }
  $('start').textContent = 'התחלה';
  startedAt = Date.now();
  buildSteps();
  runStep(0);
};

// ---------- שלבים ----------
function buildSteps() {
  steps = [];
  PKG.forEach((q, pi) => q.list.forEach(it => {
    const id = pi + ':' + it.key;
    if (it.k === 'v') steps.push({ k: 'v', pi, it, id });
    else {
      const last = steps[steps.length - 1];
      if (last && last.k === 'q' && last.pi === pi) last.items.push({ it, id });
      else steps.push({ k: 'q', pi, items: [{ it, id }] });
    }
  }));
}
const stepBar = () => steps.map((_, j) => '<i class="' + (j <= si ? 'on' : '') + '"></i>').join('');
function runStep(i) {
  si = i;
  if (si >= steps.length) return sendAll();
  const s = steps[si];
  if (s.k === 'v') playVideo(s); else showQuestions(s);
}

// ---------- סרטון: אין דילוג קדימה, אין האצה, אין הורדה בלחיצה ארוכה ----------
const resolveSrc = window.resolveVideoSrc || (u => u);
function embedUrl(url) {
  const drive = String(url).match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/);
  if (drive) return { src: 'https://drive.usercontent.google.com/download?id=' + drive[1] + '&export=download',
                      fallback: 'https://drive.google.com/file/d/' + drive[1] + '/preview' };
  return { src: url };
}
let vTimer = null;
async function playVideo(s) {
  const it = s.it, my = si;
  views[s.id] = 1;
  $('steps1').innerHTML = stepBar();
  $('vcrumb').innerHTML = esc(it.cat) + (it.sub && it.sub !== it.cat ? ' <span class="ch">‹</span> ' + esc(it.sub) : '');
  $('vname').textContent = it.title || '';
  $('vbox').classList.remove('tall');
  clearInterval(vTimer);
  const ready = on => {
    $('vdone').classList.toggle('hidden', !on);
    $('vagain').classList.toggle('hidden', !on);
    $('vask').textContent = on ? 'הבנת?' : 'צפה בסרטון עד הסוף';
  };
  ready(false);
  $('vask').textContent = 'טוען סרטון...';
  show('s-video');

  const e = embedUrl(it.url);
  $('vbox').innerHTML = '<video controls playsinline preload="auto" controlslist="nodownload noplaybackrate noremoteplayback" disablepictureinpicture disableremoteplayback></video>';
  const video = $('vbox').querySelector('video');
  video.addEventListener('contextmenu', ev => ev.preventDefault());
  let maxT = 0, done = false;
  video.addEventListener('loadedmetadata', () => {
    if (si !== my) return;
    if (video.videoHeight > video.videoWidth) $('vbox').classList.add('tall');
    if (!done) $('vask').textContent = 'צפה בסרטון עד הסוף';
  });
  video.addEventListener('timeupdate', () => { if (!video.seeking && video.currentTime > maxT) maxT = video.currentTime; });
  video.addEventListener('seeking', () => { if (!done && video.currentTime > maxT + 1) video.currentTime = maxT; });
  video.addEventListener('ratechange', () => { if (video.playbackRate > 1) video.playbackRate = 1; });
  video.addEventListener('ended', () => { if (si === my) { done = true; ready(true); } });
  video.addEventListener('error', () => {
    if (si !== my) return;
    if (e.fallback) {
      $('vbox').innerHTML = '<iframe src="' + esc(e.fallback) + '" allow="autoplay; fullscreen" allowfullscreen></iframe>';
      let left = it.minSeconds == null ? 180 : it.minSeconds;
      const tick = () => {
        if (left <= 0) { clearInterval(vTimer); return ready(true); }
        $('vask').textContent = 'אפשר להתקדם בעוד ' + left-- + ' שניות';
      };
      tick(); vTimer = setInterval(tick, 1000);
    } else $('vask').textContent = 'הסרטון לא נטען — בדוק אינטרנט ורענן';
  });
  video.src = await resolveSrc(e.src);
}
$('vagain').onclick = () => {
  const s = steps[si];
  views[s.id] = (views[s.id] || 1) + 1;
  const v = $('vbox').querySelector('video');
  if (v) { v.currentTime = 0; v.play().catch(() => {}); }
};
$('vdone').onclick = () => { clearInterval(vTimer); $('vbox').innerHTML = ''; runStep(si + 1); };

// ---------- שאלות ----------
function shuffledIdx(n) {
  const a = Array.from({ length: n }, (_, i) => i);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
let qNum = 0;
function showQuestions(s) {
  $('steps2').innerHTML = stepBar();
  $('quiz').innerHTML = s.items.map(({ it, id }, n) => {
    const name = 'a' + n;
    const body = it.type === 'choice'
      ? shuffledIdx(it.options.length).map(j => '<label class="row"><input type="radio" name="' + name + '" value="' + j + '">' +
          '<span class="box">' + esc(it.options[j]) + '</span></label>').join('')
      : '<textarea class="field" name="' + name + '" placeholder="התשובה שלך"></textarea>';
    const img = it.image && it.image.url ? '<img src="' + esc(it.image.url) + '" alt="">' : '';
    return '<div class="q" id="qq' + n + '"><p>' + (qNum + n + 1) + '. ' + esc(it.text) +
           '<small>' + esc(it.cat) + (it.sub && it.sub !== it.cat ? ' ‹ ' + esc(it.sub) : '') + '</small></p>' + img + body + '</div>';
  }).join('');
  const last = si === steps.length - 1;
  $('send').textContent = last ? 'שליחת המבחן' : 'המשך';
  $('send').disabled = false;
  $('qerr').textContent = '';
  show('s-quiz');
}
$('send').onclick = () => {
  if (si >= steps.length) return sendAll();
  const s = steps[si], f = $('quiz');
  let missing = null;
  s.items.forEach(({ it, id }, n) => {
    const box = $('qq' + n);
    box.classList.remove('missing');
    let answer, ok = null;
    if (it.type === 'choice') {
      const sel = f.querySelector('input[name="a' + n + '"]:checked');
      if (sel) { answer = it.options[+sel.value]; ok = +sel.value === it.correct - 1; }
    } else answer = f.elements['a' + n].value.trim();
    if (!answer) { box.classList.add('missing'); missing = missing || box; }
    answers[id] = { answer, ok };
  });
  if (missing) {
    $('qerr').textContent = 'יש שאלות שלא נענו (מסומנות באדום).';
    missing.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  if (si === steps.length - 1) return sendAll();
  qNum += s.items.length;
  runStep(si + 1);
};

// ---------- תוצאות ----------
function resultsFor(pi) {
  const q = PKG[pi], cats = {}, rows = [];
  let right = 0, total = 0;
  q.list.forEach(it => {
    const id = pi + ':' + it.key;
    if (it.k === 'v') { rows.push({ k: 'v', it, views: views[id] || 0 }); return; }
    const a = answers[id] || {};
    rows.push({ k: 'q', it, answer: a.answer, ok: a.ok });
    if (it.type !== 'choice') return;
    const c = cats[it.cat] = cats[it.cat] || { right: 0, total: 0 };
    c.total++; total++;
    if (a.ok) { c.right++; right++; }
  });
  return { q, cats, rows, right, total };
}
const pct = (r, t) => t ? Math.round(r / t * 100) : 0;
function buildEmailData(name) {
  const res = PKG.map((_, pi) => resultsFor(pi));
  const right = res.reduce((a, r) => a + r.right, 0), total = res.reduce((a, r) => a + r.total, 0);
  const allCats = {};
  res.forEach(r => Object.keys(r.cats).forEach(c => {
    const t = allCats[c] = allCats[c] || { right: 0, total: 0 };
    t.right += r.cats[c].right; t.total += r.cats[c].total;
  }));
  const end = Date.now(), mins = Math.max(0, Math.round((end - startedAt) / 60000));
  const title = PKG.length > 1 ? PKG.length + ' מבחנים' : PKG[0].title;
  const data = {
    _subject: title + ': ' + name + (total ? ' — ' + pct(right, total) + '%' : ''),
    _template: 'box', _captcha: 'false',
    'שם': name,
    'ציון כולל': right + '/' + total + ' (' + pct(right, total) + '%)',
    'התחיל': new Date(startedAt).toLocaleString('he-IL'),
    'משך': mins + ' דקות',
  };
  Object.keys(allCats).forEach(c => { data['ציון — ' + c] = allCats[c].right + '/' + allCats[c].total + ' (' + pct(allCats[c].right, allCats[c].total) + '%)'; });
  let n = 0;
  res.forEach(r => {
    if (res.length > 1) data['— מבחן: ' + r.q.title] = 'ציון ' + r.right + '/' + r.total;
    r.rows.forEach(row => {
      n++;
      const where = '[' + row.it.cat + (row.it.sub && row.it.sub !== row.it.cat ? ' ‹ ' + row.it.sub : '') + '] ';
      if (row.k === 'v') data[n + '. 🎬 ' + where + row.it.title] = row.views > 1 ? 'צפה ' + row.views + ' פעמים (לא הבין בפעם הראשונה)' : 'צפה פעם אחת';
      else data[n + '. ' + where + row.it.text] = row.answer + (row.ok === true ? '  ✅' : row.ok === false ? '  ❌' : '  (פתוחה — לבדיקה)');
    });
  });
  return data;
}
function subRecord(r, name, mail) {
  return {
    name, at: Date.now(), startedAt, right: r.right, total: r.total, pct: pct(r.right, r.total), mail,
    cats: Object.keys(r.cats).map(c => ({ name: c, right: r.cats[c].right, total: r.cats[c].total })),
    answers: r.rows.filter(x => x.k === 'q').map(x => ({ cat: x.it.cat, sub: x.it.sub || '', q: x.it.text, a: x.answer,
                                                        ok: x.ok === null ? 'open' : (x.ok ? 'yes' : 'no') })),
    views: r.rows.filter(x => x.k === 'v').map(x => ({ title: x.it.title, n: x.views })),
  };
}

async function putJSON(url, body) {
  const res = await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('save ' + res.status);
}
// שמירה: אותו מפתח בכל ניסיון, לכן לחיצה חוזרת לא מכפילה
async function saveResults(name, mail) {
  const key = subKeyFor(name);
  for (let pi = 0; pi < PKG.length; pi++)
    await putJSON(DB('/submissions/' + PKG[pi].id + '/' + encodeURIComponent(key)), subRecord(resultsFor(pi), name, mail));
}
// נעילת הקישור ברגע ההגשה
async function lockLink(name) {
  if (!(code || bundleId)) return putJSON(DB('/done/' + PKG[0].id + '/' + encodeURIComponent(nameKey(name))), Date.now());
  const res = await fetch(lockUrl(), { method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ used: Date.now(), name }) });
  if (!res.ok) throw new Error('lock ' + res.status);
}
async function markMail(name, mail) {
  const key = subKeyFor(name);
  for (const q of PKG) {
    try {
      await fetch(DB('/submissions/' + q.id + '/' + encodeURIComponent(key)), {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mail }) });
    } catch (e) {}
  }
}

// כל שלב נזכר בנפרד: ניסיון חוזר לא שומר שוב (הכללים חוסמים דריסה) אבל כן מנסה לנעול שוב
let savedOk = false, lockedOk = false;
async function sendAll() {
  const name = $('name').value.trim();
  const data = buildEmailData(name);
  if ($('s-quiz').classList.contains('hidden')) { $('quiz').innerHTML = ''; show('s-quiz'); }
  $('send').disabled = true; $('send').textContent = 'שולח...';
  $('qerr').textContent = '';
  const retry = msg => { $('qerr').textContent = msg; $('send').disabled = false; $('send').textContent = 'שליחת המבחן'; };

  // 1. שמירה — קודם כול, עם המתנה לאישור. בלי זה אין הגשה.
  if (!savedOk) {
    try { await saveResults(name, 'pending'); savedOk = true; }
    catch (err) { return retry('ההגשה לא נשמרה. בדוק שיש אינטרנט ולחץ שוב — התשובות שלך נשארו כאן.'); }
  }
  // 2. נעילת הקישור
  if (!lockedOk) {
    try { await lockLink(name); lockedOk = true; }
    catch (err) {
      let used = null;
      if (code || bundleId) { try { used = (await (await fetch(lockUrl(), { cache: 'no-store' })).json()) || null; } catch (e) {} }
      if (used && used.used) return usedScreen(used.name);
      return retry('ההגשה נשמרה אבל לא הושלמה. בדוק שיש אינטרנט ולחץ שוב.');
    }
    try { localStorage.setItem(DONE_KEY(name), '1'); } catch (e) {}
  }

  // 3. מייל — השלב היחיד שמותר לו להיכשל
  try {
    const res = await fetch('https://formsubmit.co/ajax/' + encodeURIComponent(resultsEmail), {
      method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(data) });
    const json = await res.json().catch(() => ({}));
    if (!res.ok || String(json.success) !== 'true') throw new Error(json.message || res.status);
    await markMail(name, 'sent');
  } catch (err) {
    await markMail(name, 'failed');
    $('doneNote').textContent = 'ההגשה נקלטה ונשמרה. שליחת המייל למנהל לא עברה — המנהל רואה את התוצאות אצלו. אתה לא צריך למלא שוב.';
  }
  show('s-done');
}

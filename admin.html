<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ניהול המבחן</title>
<meta name="theme-color" content="#0b63c4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f4; --card:#fff; --text:#0f1b21; --muted:#67757e; --line:#e2e8ec; --soft:#eaf4fc;
    --accent:#0b63c4; --accent2:#41b8f0; --bad:#c0392b;
    --grad:linear-gradient(135deg,#0b63c4 0%,#41b8f0 100%);
    --shadow:0 10px 30px -18px rgba(10,30,50,.5);
    --radius:18px;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0d1416;--card:#151f22;--text:#e7eef0;--muted:#93a3aa;--line:#243036;--soft:#13293d;--shadow:0 10px 30px -18px #000}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);
       font:17px/1.65 Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}

  header{background:var(--grad);color:#fff;padding:24px 20px 44px;position:relative}
  header::after{content:"";position:absolute;inset-inline:0;bottom:-1px;height:26px;background:var(--bg);border-radius:26px 26px 0 0}
  header .logo{display:block;width:140px;max-width:52%;border-radius:12px;margin-bottom:12px;
               box-shadow:0 6px 18px -8px rgba(0,0,0,.55)}
  header h1{margin:0;font-size:23px;font-weight:800;letter-spacing:-.01em}
  header .ver{font-size:12px;font-weight:500;opacity:.75;margin-inline-start:8px}

  main{max-width:620px;margin:-22px auto 0;padding:0 16px 130px;position:relative;z-index:1}
  h2{font-size:19px;font-weight:700;margin:0 0 12px;letter-spacing:-.01em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
        padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .muted{color:var(--muted);font-size:15px}

  label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 5px}
  input,textarea,select{width:100%;font:inherit;padding:13px;border:1.5px solid var(--line);border-radius:13px;
        background:transparent;color:inherit;transition:border-color .15s,box-shadow .15s}
  input:focus,textarea:focus{outline:0;border-color:var(--accent2);
        box-shadow:0 0 0 4px color-mix(in srgb,var(--accent2) 18%,transparent)}
  textarea{min-height:76px;resize:vertical}

  button{font:inherit;font-weight:700;padding:13px 16px;border:0;border-radius:14px;
         background:var(--grad);color:#fff;cursor:pointer;transition:transform .12s,opacity .15s}
  button:active:not(:disabled){transform:scale(.985)}
  button.full{width:100%;margin-top:14px}
  button.ghost{background:none;border:1.5px dashed var(--line);color:var(--accent2);box-shadow:none}
  button.mini{padding:7px 12px;font-size:14px;border-radius:10px;background:var(--soft);color:var(--text)}
  button.del{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad)}
  button:disabled{opacity:.4;cursor:default}

  .item{border:1.5px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px;
        background:color-mix(in srgb,var(--soft) 45%,transparent)}
  .item-head{display:flex;gap:6px;align-items:center;justify-content:space-between;margin-bottom:2px}
  .item-head b{flex:1;font-size:15px}
  .opt{display:flex;gap:10px;align-items:center;margin-top:9px}
  .opt input[type=radio]{width:22px;height:22px;flex:none;accent-color:var(--accent2)}
  .opt input[type=text]{flex:1}

  .bar{position:fixed;bottom:0;inset-inline:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
       background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);
       border-top:1px solid var(--line)}
  .bar div{max-width:620px;margin:0 auto;display:flex;gap:10px}
  .bar button{flex:1}
  #status{font-size:14px;font-weight:600;min-height:1.3em;text-align:center;margin-top:7px}
  .ok{color:var(--accent2)} .err{color:var(--bad)}

  .prog{height:9px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
  .prog div{height:100%;width:0;background:var(--grad);transition:width .3s}

  details{background:var(--soft);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:15px}
  summary{font-weight:700;cursor:pointer;color:var(--accent)}
  @media (prefers-color-scheme:dark){summary{color:var(--accent2)}}
  details ol{padding-inline-start:20px;margin:10px 0}

  .row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .hidden{display:none}
</style>
</head>
<body>
<header>
  <img class="logo" src="logo.png?v=1" alt="מבנים — בדק בית וייעוץ הנדסי">
  <h1>ניהול המבחן<span class="ver">גרסה 11</span></h1>
</header>
<main>

  <!-- כניסה -->
  <section id="s-login" class="card">
    <h2>כניסת מנהל</h2>
    <label class="f">אימייל</label><input id="email" type="email" autocomplete="username">
    <label class="f">סיסמה</label><input id="pass" type="password" autocomplete="current-password">
    <button class="full" id="login">כניסה</button>
    <p id="loginErr" class="err"></p>
  </section>

  <!-- רשימת מבחנים -->
  <section id="s-list" class="card hidden">
    <h2>המבחנים שלי</h2>
    <div id="list"></div>
    <button class="full" id="newQuiz">+ מבחן חדש</button>
  </section>

  <!-- עורך -->
  <div id="editor" class="hidden">
    <button class="ghost" id="back" style="margin-bottom:12px">→ לכל המבחנים</button>
    <section class="card">
      <h2>הגדרות</h2>
      <label class="f">כותרת המבחן</label><input id="title">
      <label class="f">לאיזה מייל לשלוח את התוצאות</label><input id="resultsEmail" type="email">
    </section>

    <section class="card">
      <h2>סרטונים</h2>
      <div id="videos"></div>
      <input type="file" id="pick" accept="video/*" multiple hidden>
      <button class="full" id="addFiles">📱 העלאה מהגלריה</button>
      <p class="muted" style="text-align:center;margin:6px 0 0">אפשר לבחור כמה סרטונים בבת אחת</p>
      <details style="margin-top:14px">
        <summary>או: הוספת סרטון מ־Google Drive</summary>
        <ol>
          <li>ב־Drive: ⋮ ליד הסרטון ← <b>שיתוף</b> ← "כל מי שיש לו את הקישור".</li>
          <li>⋮ ← <b>העתקת קישור</b>.</li>
          <li>כאן: הכפתור למטה ← הדבק את הקישור ← <b>שמירה</b>.</li>
        </ol>
        <button class="full ghost" id="addVideo">+ סרטון מקישור Drive</button>
      </details>
    </section>

    <section class="card">
      <h2>שאלות</h2>
      <div id="questions"></div>
      <button class="full ghost" id="addChoice">+ שאלה אמריקאית</button>
      <button class="full ghost" id="addOpen">+ שאלה פתוחה</button>
    </section>
  </div>
</main>

<div class="bar hidden" id="bar"><div>
  <button class="ghost" id="preview">תצוגה מקדימה</button>
  <button id="save">שמירה</button>
</div><div id="status"></div></div>

<script src="settings.js?v=11"></script>
<script src="demo.js?v=11"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEFAULT_SECONDS = 180;            // זמן המתנה ברירת מחדל לסרטון מ־Drive (שם אי אפשר לדעת מתי הסרטון נגמר)
const CHUNK = 2 * 1024 * 1024;          // גודל חתיכת העלאה (חייב להיות כפולה של 256KB). קטן = התקדמות נראית גם ברשת סלולרית איטית
const STORAGE = 'https://firebasestorage.googleapis.com/v0/b/' + SETTINGS.storageBucket + '/o';
const files = new Map();                // _key -> File, לסרטונים שבהעלאה (לצורך "נסה שוב")
let pendingDeletes = [];                // קבצים שהוסרו מהמבחן ויימחקו בשמירה, אם אף מבחן אחר לא משתמש בהם
let token = null, quizzes = {}, quizId = null, quiz = null, dirty = false;
const DB = path => SETTINGS.databaseURL + '/quizzes' + path + '.json';
const SUBS = path => SETTINGS.databaseURL + '/submissions' + path + '.json';
const INV = path => SETTINGS.databaseURL + '/invites' + path + '.json';
const CODE_CHARS = 'abcdefghjkmnpqrstuvwxyz23456789';           // בלי אותיות וספרות שמתבלבלות
const newCode = () => Array.from({ length: 6 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
const inviteLink = (id, c) => new URL('index.html?t=' + id + '&c=' + c, location.href).href;
const quizLink = id => new URL('index.html?t=' + id, location.href).href;
const newId = () => Math.random().toString(36).slice(2, 8);

function status(msg, cls) { $('status').textContent = msg; $('status').className = cls || ''; }

// ---------- כניסה ----------
async function login(email, password) {
  const res = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + SETTINGS.apiKey, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, returnSecureToken: true }),
  });
  const j = await res.json();
  if (!res.ok) throw new Error(j.error && j.error.message);
  return j.idToken;
}
$('login').onclick = async () => {
  $('loginErr').textContent = '';
  $('login').disabled = true;
  try {
    token = await login($('email').value.trim(), $('pass').value);
    sessionStorageSet('cred', JSON.stringify({ e: $('email').value.trim(), p: $('pass').value }));
    await load();
  } catch (e) {
    $('loginErr').textContent = 'אימייל או סיסמה לא נכונים.';
  }
  $('login').disabled = false;
};
function sessionStorageSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
function sessionStorageGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

// ---------- רשימת המבחנים ----------
async function authed(method, path, body) {
  const go = () => fetch(DB(path) + '?auth=' + encodeURIComponent(token), {
    method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body),
  });
  let res = await go();
  if (res.status === 401) { await relogin(); res = await go(); }
  if (!res.ok) throw new Error(res.status);
  return res;
}
async function relogin() {                // הכניסה פגה (אחרי שעה) — נכנסים מחדש בשקט
  const c = JSON.parse(sessionStorageGet('cred') || 'null');
  if (!c) throw new Error('auth');
  token = await login(c.e, c.p);
}
async function authedUrl(method, url, body) {
  const go = () => fetch(url + '?auth=' + encodeURIComponent(token), {
    method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body),
  });
  let res = await go();
  if (res.status === 401) { await relogin(); res = await go(); }
  if (!res.ok) throw new Error(res.status);
  return res;
}
async function load() {
  const res = await fetch(DB(''), { cache: 'no-store' });
  quizzes = (await res.json()) || {};
  showList();
}
function screen(id) {
  ['s-login', 's-list', 'editor'].forEach(x => $(x).classList.toggle('hidden', x !== id));
  $('bar').classList.toggle('hidden', id !== 'editor');
  status(''); scrollTo(0, 0);
}
function showList() {
  const ids = Object.keys(quizzes).sort((a, b) => (quizzes[b].updated || 0) - (quizzes[a].updated || 0));
  $('list').innerHTML = ids.length ? ids.map(id => {
    const q = quizzes[id];
    return '<div class="item"><b>' + esc(q.title) + '</b><div class="muted">' +
      (q.videos || []).length + ' סרטונים · ' + (q.questions || []).length + ' שאלות</div><div class="row">' +
      '<button class="mini" data-list="edit" data-id="' + id + '">עריכה</button>' +
      '<button class="mini" data-list="wa" data-id="' + id + '">שליחה בוואטסאפ</button>' +
      '<button class="mini" data-list="copy" data-id="' + id + '">העתקת קישור</button>' +
      '<button class="mini" data-list="links" data-id="' + id + '">קישורים אישיים</button>' +
      '<button class="mini" data-list="who" data-id="' + id + '">מי הגיש</button>' +
      '<button class="mini" data-list="dup" data-id="' + id + '">שכפול</button>' +
      '<button class="mini del" data-list="del" data-id="' + id + '">מחיקה</button></div>' +
      '<div id="who-' + id + '"></div></div>';
  }).join('') : '<p class="muted">עוד אין מבחנים. לחץ "+ מבחן חדש".</p>';
  screen('s-list');
}
function openQuiz(id, data) {
  quizId = id;
  quiz = JSON.parse(JSON.stringify(data || {}));
  quiz.title = quiz.title || 'מבחן חדש';
  quiz.resultsEmail = quiz.resultsEmail || lastEmail();
  quiz.videos = (quiz.videos || []).map(v => Object.assign({ kind: 'drive', _key: newId() }, v));
  quiz.questions = (quiz.questions || []).map(q => q.type === 'choice' ? Object.assign({ options: ['', ''] }, q) : q);
  pendingDeletes = [];
  $('title').value = quiz.title;
  $('resultsEmail').value = quiz.resultsEmail;
  dirty = !data;
  render();
  screen('editor');
}
function lastEmail() {
  const any = Object.values(quizzes).find(q => q.resultsEmail);
  return any ? any.resultsEmail : '';
}
$('list').addEventListener('click', async e => {
  const d = e.target.dataset, id = d.id;
  if (!d.list) return;
  if (d.list === 'edit') openQuiz(id, quizzes[id]);
  else if (d.list === 'who') showWho(id);
  else if (d.list === 'links') showLinks(id);
  else if (d.list === 'mklinks') {
    const n = Math.min(50, Math.max(1, +($('cnt-' + id) || {}).value || 1));
    const batch = {};
    for (let i = 0; i < n; i++) batch[newCode()] = { created: Date.now() };
    try { await authedUrl('PATCH', INV('/' + id), batch); } catch (e) { alert('היצירה נכשלה. נסה שוב.'); return; }
    $('who-' + id).dataset.open = ''; showLinks(id);
  }
  else if (d.list === 'copylink' || d.list === 'walink') {
    const url = inviteLink(id, d.key);
    if (d.list === 'walink') return open('https://wa.me/?text=' + encodeURIComponent(quizzes[id].title + '\n' + url), '_blank');
    try { await navigator.clipboard.writeText(url); e.target.textContent = 'הועתק ✅'; }
    catch (err) { prompt('העתק את הקישור:', url); }
  }
  else if (d.list === 'dellink') {
    if (!confirm('למחוק את הקישור הזה? הוא יפסיק לעבוד.')) return;
    await authedUrl('DELETE', INV('/' + id + '/' + encodeURIComponent(d.key)));
    $('who-' + id).dataset.open = ''; showLinks(id);
  }
  else if (d.list === 'reopen') {
    if (!confirm('לאפשר למשתתף הזה לעשות את המבחן שוב?')) return;
    await authedUrl('DELETE', SUBS('/' + id + '/' + encodeURIComponent(d.key)));
    $('who-' + id).dataset.open = ''; showWho(id);
  }
  else if (d.list === 'reopenall') {
    if (!confirm('לאפס את כל ההגשות? כל מי שכבר עשה את המבחן יוכל לעשות אותו שוב.')) return;
    await authedUrl('DELETE', SUBS('/' + id));
    $('who-' + id).dataset.open = ''; showWho(id);
  }
  else if (d.list === 'wa') open('https://wa.me/?text=' + encodeURIComponent(quizzes[id].title + '\n' + quizLink(id)), '_blank');
  else if (d.list === 'copy') {
    try { await navigator.clipboard.writeText(quizLink(id)); e.target.textContent = 'הועתק ✅'; }
    catch (err) { prompt('העתק את הקישור:', quizLink(id)); }
  }
  else if (d.list === 'dup') {
    const copy = JSON.parse(JSON.stringify(quizzes[id]));
    copy.title += ' (עותק)';
    openQuiz(newId(), copy); dirty = true; status('עותק חדש — שמור כדי ליצור אותו');
  }
  else if (d.list === 'del') {
    if (!confirm('למחוק את "' + quizzes[id].title + '"? הקישור שלו יפסיק לעבוד.')) return;
    try {
      const paths = (quizzes[id].videos || []).filter(v => v.path).map(v => v.path);
      await authed('DELETE', '/' + id); delete quizzes[id];
      authedUrl('DELETE', SUBS('/' + id)).catch(() => {});
      authedUrl('DELETE', INV('/' + id)).catch(() => {});
      deleteUnused(paths);
      showList();
    }
    catch (err) { alert('המחיקה נכשלה. נסה שוב.'); }
  }
});
async function showLinks(id) {
  const box = $('who-' + id);
  if (box.dataset.open === 'links') { box.dataset.open = ''; box.innerHTML = ''; return; }
  box.dataset.open = 'links';
  box.innerHTML = '<p class="muted">טוען...</p>';
  let inv = {};
  try { inv = (await (await fetch(INV('/' + id), { cache: 'no-store' })).json()) || {}; }
  catch (e) { box.innerHTML = '<p class="err">לא הצלחתי לטעון. נסה שוב.</p>'; return; }
  const codes = Object.keys(inv).sort((a, b) => (inv[a].used ? 1 : 0) - (inv[b].used ? 1 : 0));
  const free = codes.filter(c => !inv[c].used).length;
  box.innerHTML = '<div class="item" style="margin-top:12px">' +
    '<b>קישורים אישיים — כל קישור להגשה אחת</b>' +
    '<p class="muted">פנויים: ' + free + ' · נוצלו: ' + (codes.length - free) + '</p>' +
    '<div class="opt"><input id="cnt-' + id + '" type="number" min="1" max="50" value="5" style="flex:none;width:90px">' +
    '<button class="mini" data-list="mklinks" data-id="' + id + '">צור קישורים</button></div>' +
    codes.map(c => inv[c].used
      ? '<div class="opt" style="justify-content:space-between;opacity:.65"><span>🔒 ' + esc(inv[c].name || '') +
        '<span class="muted"> · ' + new Date(inv[c].used).toLocaleString('he-IL') + '</span></span>' +
        '<button class="mini del" data-list="dellink" data-id="' + id + '" data-key="' + esc(c) + '">מחיקה</button></div>'
      : '<div class="opt" style="justify-content:space-between;flex-wrap:wrap"><span dir="ltr">' + esc(c) + '</span><span class="row" style="margin:0">' +
        '<button class="mini" data-list="walink" data-id="' + id + '" data-key="' + esc(c) + '">וואטסאפ</button>' +
        '<button class="mini" data-list="copylink" data-id="' + id + '" data-key="' + esc(c) + '">העתקה</button>' +
        '<button class="mini del" data-list="dellink" data-id="' + id + '" data-key="' + esc(c) + '">מחיקה</button></span></div>').join('') +
    '</div>';
}

async function showWho(id) {
  const box = $('who-' + id);
  if (box.dataset.open === 'who') { box.dataset.open = ''; box.innerHTML = ''; return; }
  box.dataset.open = 'who';
  box.innerHTML = '<p class="muted">טוען...</p>';
  let subs = {};
  try { subs = (await (await fetch(SUBS('/' + id), { cache: 'no-store' })).json()) || {}; }
  catch (e) { box.innerHTML = '<p class="err">לא הצלחתי לטעון. נסה שוב.</p>'; return; }
  const keys = Object.keys(subs).sort((a, b) => (subs[b].at || 0) - (subs[a].at || 0));
  box.innerHTML = '<div class="item" style="margin-top:12px"><b>הגישו: ' + keys.length + '</b>' +
    (keys.length ? keys.map(k =>
      '<div class="opt" style="justify-content:space-between"><span>' + esc(subs[k].name || k) +
      '<span class="muted"> · ' + new Date(subs[k].at || 0).toLocaleString('he-IL') + '</span></span>' +
      '<button class="mini" data-list="reopen" data-id="' + id + '" data-key="' + esc(k) + '">לאפשר שוב</button></div>').join('') +
      '<button class="mini del" style="margin-top:10px" data-list="reopenall" data-id="' + id + '">איפוס כל ההגשות</button>'
      : '<p class="muted">עוד אף אחד לא הגיש.</p>') + '</div>';
}

$('newQuiz').onclick = () => openQuiz(newId(), null);
$('back').onclick = () => {
  if (dirty && !confirm('יש שינויים שלא נשמרו. לצאת בלי לשמור?')) return;
  dirty = false; showList();
};

// ---------- ציור הרשימות ----------
function moveBtns(kind, i, n) {
  return '<button class="mini" data-act="up" data-kind="' + kind + '" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + '>▲</button>' +
         '<button class="mini" data-act="down" data-kind="' + kind + '" data-i="' + i + '"' + (i === n - 1 ? ' disabled' : '') + '>▼</button>' +
         '<button class="mini del" data-act="del" data-kind="' + kind + '" data-i="' + i + '">מחיקה</button>';
}
function render() {
  const V = quiz.videos, Q = quiz.questions;
  $('videos').innerHTML = V.length ? V.map((v, i) => {
    let h = '<div class="item"><div class="item-head"><b>סרטון ' + (i + 1) + (v.kind === 'file' ? ' · מהגלריה' : ' · מ־Drive') + '</b>' + moveBtns('videos', i, V.length) + '</div>' +
      '<label class="f">שם הסרטון</label><input data-kind="videos" data-i="' + i + '" data-f="title" value="' + esc(v.title) + '">';
    if (v.kind === 'file') {
      h += v.uploading
        ? '<div class="prog"><div id="p-' + v._key + '" style="width:' + (v.progress || 0) + '%"></div></div><div class="muted" id="t-' + v._key + '">מעלה... ' + (v.progress || 0) + '%</div>'
        : v.error
          ? '<p class="err">ההעלאה נכשלה. <span class="muted">(' + esc(v.errMsg) + ')</span></p><button class="mini" data-act="retry" data-i="' + i + '">נסה שוב</button>'
          : '<p class="muted" style="margin:8px 0 0">✅ הועלה' + (v.size ? ' (' + Math.round(v.size / 1048576) + 'MB)' : '') + ' · העובד חייב לצפות עד הסוף כדי להמשיך</p>';
    } else {
      h += '<label class="f">קישור מ־Drive</label><input data-kind="videos" data-i="' + i + '" data-f="url" dir="ltr" placeholder="https://drive.google.com/file/d/..." value="' + esc(v.url) + '">' +
        '<label class="f">כמה שניות לחכות לפני "הבא" (3 דקות = 180)</label><input type="number" min="0" data-kind="videos" data-i="' + i + '" data-f="minSeconds" value="' + esc(v.minSeconds) + '">';
    }
    return h + '</div>';
  }).join('') : '<p class="muted">אין סרטונים עדיין.</p>';

  $('questions').innerHTML = Q.length ? Q.map((q, i) => {
    let h = '<div class="item"><div class="item-head"><b>שאלה ' + (i + 1) + ' · ' + (q.type === 'choice' ? 'אמריקאית' : 'פתוחה') + '</b>' + moveBtns('questions', i, Q.length) + '</div>' +
      '<textarea data-kind="questions" data-i="' + i + '" data-f="text" placeholder="נוסח השאלה">' + esc(q.text) + '</textarea>';
    if (q.type === 'choice') {
      h += '<p class="muted" style="margin:8px 0 0">סמן את התשובה הנכונה בעיגול:</p>';
      h += q.options.map((o, j) =>
        '<div class="opt"><input type="radio" name="c' + i + '" data-correct="' + i + '" value="' + (j + 1) + '"' + (q.correct === j + 1 ? ' checked' : '') + '>' +
        '<input type="text" data-opt="' + i + '" data-j="' + j + '" placeholder="תשובה ' + (j + 1) + '" value="' + esc(o) + '">' +
        (q.options.length > 2 ? '<button class="mini del" data-act="delopt" data-i="' + i + '" data-j="' + j + '">✕</button>' : '') + '</div>').join('');
      h += '<button class="mini" style="margin-top:8px" data-act="addopt" data-i="' + i + '">+ תשובה</button>';
    }
    return h + '</div>';
  }).join('') : '<p class="muted">אין שאלות עדיין.</p>';
}

// ---------- עריכה ----------
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.kind && d.f) quiz[d.kind][+d.i][d.f] = t.type === 'number' ? (t.value === '' ? 0 : +t.value) : t.value;
  else if (d.opt != null) quiz.questions[+d.opt].options[+d.j] = t.value;
  else if (d.correct != null) quiz.questions[+d.correct].correct = +t.value;
  else if (['title', 'resultsEmail'].includes(t.id)) quiz[t.id] = t.value;
  else return;
  dirty = true; status('יש שינויים שלא נשמרו');
});
document.addEventListener('click', e => {
  const d = e.target.dataset;
  if (!d.act) return;
  e.preventDefault();
  const list = d.kind ? quiz[d.kind] : null, i = +d.i;
  if (d.act === 'up') [list[i - 1], list[i]] = [list[i], list[i - 1]];
  else if (d.act === 'down') [list[i + 1], list[i]] = [list[i], list[i + 1]];
  else if (d.act === 'del') {
    if (!confirm('למחוק?')) return;
    const [gone] = list.splice(i, 1);
    if (gone && gone.path) { if (gone.uploading) gone.cancelled = true; else pendingDeletes.push(gone.path); }
  }
  else if (d.act === 'retry') { uploadVideo(quiz.videos[i]); return; }
  else if (d.act === 'addopt') quiz.questions[i].options.push('');
  else if (d.act === 'delopt') {
    const q = quiz.questions[i], j = +d.j;
    q.options.splice(j, 1);
    if (q.correct === j + 1) q.correct = 0; else if (q.correct > j + 1) q.correct--;
  }
  dirty = true; status('יש שינויים שלא נשמרו'); render();
});
$('addVideo').onclick = () => { quiz.videos.push({ kind: 'drive', _key: newId(), title: '', url: '', minSeconds: DEFAULT_SECONDS }); dirty = true; render(); };
$('addFiles').onclick = () => $('pick').click();
$('pick').onchange = async () => {
  const picked = Array.from($('pick').files);
  $('pick').value = '';
  const items = picked.map(f => {
    const v = { kind: 'file', _key: newId(), title: f.name.replace(/\.[^.]+$/, ''), url: '', size: f.size,
                path: 'videos/' + Date.now() + '-' + newId() + (f.name.match(/\.[\w]+$/) || ['.mp4'])[0].toLowerCase() };
    files.set(v._key, f);
    quiz.videos.push(v);
    return v;
  });
  dirty = true; render();
  for (const v of items) await uploadVideo(v);   // אחד אחרי השני — חוסך עומס על הרשת בטלפון
};

// ---------- העלאת סרטון (העלאה בחתיכות, ממשיכה מאותה נקודה אם הרשת נפלה) ----------
function showProgress(v) {
  const bar = $('p-' + v._key), txt = $('t-' + v._key);
  if (bar) bar.style.width = v.progress + '%';
  if (txt) txt.textContent = 'מעלה... ' + v.progress + '%';
}
async function storageFetch(url, opts) {
  const go = () => {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 90000);   // בקשה תקועה נחשבת כשלון ומנסים שוב
    return fetch(url, Object.assign({}, opts, { signal: ctl.signal, headers: Object.assign({ Authorization: 'Firebase ' + token }, opts.headers) }))
      .finally(() => clearTimeout(timer));
  };
  let res = await go();
  if (res.status === 401) { await relogin(); res = await go(); }
  return res;
}
async function uploadVideo(v) {
  const file = files.get(v._key);
  if (!file) return;
  v.uploading = true; v.error = false; v.progress = 0; render();
  try {
    const type = file.type || 'video/mp4';
    const start = await storageFetch(STORAGE + '?name=' + encodeURIComponent(v.path), {
      method: 'POST',
      headers: { 'X-Goog-Upload-Protocol': 'resumable', 'X-Goog-Upload-Command': 'start',
                 'X-Goog-Upload-Header-Content-Length': String(file.size), 'X-Goog-Upload-Header-Content-Type': type,
                 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify({ name: v.path, contentType: type }),
    });
    const uploadUrl = start.headers.get('X-Goog-Upload-URL');
    if (!start.ok || !uploadUrl) throw new Error('start ' + start.status);

    let offset = 0, fails = 0, result = null;
    while (!result) {
      if (v.cancelled) return;
      const end = Math.min(offset + CHUNK, file.size), last = end === file.size;
      try {
        const res = await storageFetch(uploadUrl, {
          method: 'POST',
          headers: { 'X-Goog-Upload-Command': last ? 'upload, finalize' : 'upload', 'X-Goog-Upload-Offset': String(offset) },
          body: file.slice(offset, end),
        });
        if (!res.ok) throw new Error('chunk ' + res.status);
        if (last) result = await res.json();
        offset = end; fails = 0;
      } catch (err) {
        if (++fails > 6) throw err;
        await new Promise(r => setTimeout(r, 1000 * 2 ** fails));
        const q = await storageFetch(uploadUrl, { method: 'POST', headers: { 'X-Goog-Upload-Command': 'query' } }).catch(() => null);
        const got = q && q.headers.get('X-Goog-Upload-Size-Received');
        if (got != null) offset = +got;
      }
      v.progress = Math.floor(offset / file.size * 100); showProgress(v);
    }
    v.url = STORAGE + '/' + encodeURIComponent(v.path) + '?alt=media&token=' + result.downloadTokens;
    v.uploading = false; files.delete(v._key);
    if (v.cancelled) deleteFile(v.path);
  } catch (e) {
    v.uploading = false; v.error = true; v.errMsg = e.message || String(e);
  }
  render();
  if (!quiz.videos.some(x => x.uploading)) status(quiz.videos.some(x => x.error) ? 'חלק מההעלאות נכשלו' : 'ההעלאה הסתיימה — לחץ שמירה', quiz.videos.some(x => x.error) ? 'err' : 'ok');
}
function deleteFile(path) {
  return storageFetch(STORAGE + '/' + encodeURIComponent(path), { method: 'DELETE' }).catch(() => {});
}
function deleteUnused(paths) {
  const used = new Set();
  Object.values(quizzes).forEach(q => (q.videos || []).forEach(v => v.path && used.add(v.path)));
  if (quiz) quiz.videos.forEach(v => v.path && used.add(v.path));
  paths.filter(p => !used.has(p)).forEach(deleteFile);
}
$('addChoice').onclick = () => { quiz.questions.push({ type: 'choice', text: '', options: ['', '', '', ''], correct: 0 }); dirty = true; render(); };
$('addOpen').onclick = () => { quiz.questions.push({ type: 'open', text: '' }); dirty = true; render(); };

// ---------- בדיקה ושמירה ----------
function validate() {
  if (!/^\S+@\S+\.\S+$/.test(quiz.resultsEmail)) return 'צריך מייל תקין לתוצאות.';
  for (let i = 0; i < quiz.videos.length; i++) {
    const v = quiz.videos[i];
    if (!v.title.trim()) return 'לסרטון ' + (i + 1) + ' חסר שם.';
    if (v.uploading) return 'חכה שההעלאה של סרטון ' + (i + 1) + ' תסתיים.';
    if (v.error) return 'ההעלאה של סרטון ' + (i + 1) + ' נכשלה — נסה שוב או מחק אותו.';
    if (v.kind === 'file') continue;
    if (!/drive\.google\.com\/(file\/d\/|open\?id=)[\w-]+/.test(v.url)) return 'הקישור של סרטון ' + (i + 1) + ' הוא לא קישור Drive תקין.';
  }
  if (!quiz.questions.length) return 'צריך לפחות שאלה אחת.';
  for (let i = 0; i < quiz.questions.length; i++) {
    const q = quiz.questions[i];
    if (!q.text.trim()) return 'לשאלה ' + (i + 1) + ' חסר נוסח.';
    if (q.type === 'choice') {
      if (q.options.some(o => !o.trim())) return 'בשאלה ' + (i + 1) + ' יש תשובה ריקה.';
      if (!(q.correct >= 1 && q.correct <= q.options.length)) return 'בשאלה ' + (i + 1) + ' לא סומנה תשובה נכונה.';
    }
  }
  return null;
}
$('save').onclick = async () => {
  const problem = validate();
  if (problem) { status(problem, 'err'); return; }
  $('save').disabled = true; status('שומר...');
  try {
    quiz.updated = Date.now();
    const clean = JSON.parse(JSON.stringify(quiz));
    clean.videos = clean.videos.map(v => {
      const o = { kind: v.kind, title: v.title, url: v.url };
      if (v.kind === 'file') { o.path = v.path; o.size = v.size; } else o.minSeconds = v.minSeconds;
      return o;
    });
    await authed('PUT', '/' + quizId, clean);
    quizzes[quizId] = clean;
    deleteUnused(pendingDeletes); pendingDeletes = [];
    dirty = false; status('נשמר ✅ העובדים יראו את הגרסה החדשה מיד.', 'ok');
  } catch (e) {
    status('השמירה נכשלה. בדוק אינטרנט ונסה שוב.', 'err');
  }
  $('save').disabled = false;
};
$('preview').onclick = () => {
  if (dirty) { status('קודם שמור, ואז תצוגה מקדימה.', 'err'); return; }
  open(quizLink(quizId), '_blank');
};
addEventListener('beforeunload', e => { if (dirty || (quiz && quiz.videos.some(v => v.uploading))) { e.preventDefault(); e.returnValue = ''; } });

// כניסה אוטומטית אם כבר נכנסת בלשונית הזאת
(async () => {
  const c = JSON.parse(sessionStorageGet('cred') || 'null');
  if (!c) return;
  try { token = await login(c.e, c.p); await load(); } catch (e) {}
})();
</script>
</body>

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול המבחנים — מבנים</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* Arimo — אותו מראה כמו Arial, מאוחסן באתר עצמו (בלי שרת גופנים חיצוני). בלעדיו טלפוני אנדרואיד מציגים גופן אחר */
  @font-face{font-family:Arimo;font-weight:400;font-display:swap;src:url(fonts/arimo-hebrew-400-normal.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
  @font-face{font-family:Arimo;font-weight:700;font-display:swap;src:url(fonts/arimo-hebrew-700-normal.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
  @font-face{font-family:Arimo;font-weight:400;font-display:swap;src:url(fonts/arimo-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  @font-face{font-family:Arimo;font-weight:700;font-display:swap;src:url(fonts/arimo-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
  :root{
    --bg:#f0f0f6; --top:#ffffff; --ink:#111; --muted:#777; --box:#7a7a7a;
    --purple:#7458c4; --soft:#ece8f8; --icon:#9a9a9a; --line:#d4d4da; --bad:#d23c3c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);font:16px/1.4 Arimo,Arial,Helvetica,sans-serif;color:var(--ink)}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

  .topbar{position:sticky;top:0;z-index:5;background:var(--top);display:flex;align-items:center;gap:10px;
          padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
  .avatar svg{width:22px;height:22px;fill:var(--purple)}
  .brand{font-weight:700;font-size:20px;color:#666;flex:none}
  .sep{width:1px;height:28px;background:#ddd;flex:none}
  .sub{color:#999;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .link{font-weight:700;font-size:17px;white-space:nowrap;flex:none}
  .link::after{content:" ‹";font-size:22px}

  main{max-width:720px;margin:0 auto}
  .panel{margin:0 12px;border-inline:1px solid var(--line);min-height:calc(100vh - 64px);padding:20px 10px 40px}
  h1{font-size:24px;margin:0 0 18px;line-height:1.5}
  h1 a{color:var(--ink);text-decoration:underline;font-weight:400;cursor:pointer}
  h1 .ch{font-weight:400;margin:0 6px}

  .row{display:flex;flex-direction:row-reverse;align-items:center;gap:8px;margin-bottom:10px}
  .box{flex:1;min-width:0;border:3px solid var(--box);border-radius:9px;padding:11px 12px;font-size:18px;min-height:50px;
       display:flex;align-items:center;gap:10px;background:var(--bg);text-align:right;width:100%}
  .box > div{min-width:0;flex:1}
  .box.on{border-color:var(--purple)}
  .box small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .box small.ltr{direction:ltr;text-align:right}
  .side{display:flex;gap:4px;flex:none;align-items:center}
  .ic{width:34px;height:34px;display:grid;place-items:center}
  .ic svg{width:20px;height:20px;fill:var(--icon)}
  .chk{width:26px;height:26px;border:3px solid var(--box);border-radius:5px;display:grid;place-items:center;flex:none}
  .chk.on{background:var(--purple);border-color:var(--purple)}
  .chk.on::after{content:"✓";color:#fff;font-size:15px;font-weight:700}
  .chk.part{border-color:var(--purple)}
  .chk.part::after{content:"−";color:var(--purple);font-size:18px;font-weight:800;line-height:1}
  .allrow{display:flex;align-items:center;gap:10px;padding:12px;font-weight:700}
  .allrow .t{flex:1;min-width:0}
  .allrow .t small{display:block;font-weight:400;color:var(--muted);font-size:13px}
  @media (max-width:999px){.topbar.two .sub,.topbar.two .sep{display:none}}
  .drag{color:var(--icon);font-size:24px;width:34px;height:40px;display:grid;place-items:center;touch-action:none;cursor:grab}
  .row.dragging .box{border-color:var(--purple);box-shadow:0 6px 18px rgba(0,0,0,.15)}
  .tag{font-size:12px;color:var(--muted);border:1.5px solid var(--box);border-radius:5px;padding:0 6px;flex:none}
  .group{font-weight:700;margin:18px 0 8px;font-size:17px}
  .count{color:var(--purple);font-weight:700}
  .opts{margin:6px 0 0;padding:0 18px 0 0;font-size:15px;color:#444}
  .box.item{flex-wrap:wrap;cursor:pointer}
  .box > .preview{flex:0 0 100%;cursor:default}
  .preview video{display:block;width:100%;max-height:60vh;border-radius:6px;background:#000;margin-top:6px}
  .opts li.ok{font-weight:700;color:var(--purple)}

  .btn{display:block;width:100%;background:var(--purple);color:#fff;border:3px solid var(--purple);border-radius:9px;
       padding:11px;font-size:18px;font-weight:700;text-align:center;margin-top:8px}
  .btn.ghost{background:transparent;color:var(--purple)}
  .btn:disabled{opacity:.5}
  .field{width:100%;font:inherit;font-size:18px;border:3px solid var(--box);border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink)}
  .field:focus{outline:0;border-color:var(--purple)}
  .field.ltr{direction:ltr;text-align:right}
  label.f{display:block;font-weight:700;margin:14px 0 6px}
  .muted{color:var(--muted);font-size:14px}
  .err{color:var(--bad);font-weight:700;margin:10px 0 0}
  .foot{margin-top:28px;text-align:center}
  .foot button{color:var(--muted);text-decoration:underline;font-size:14px}
  .seg{display:flex;gap:8px;margin-top:6px}
  .seg .btn{margin-top:0}
  .opt{display:flex;flex-direction:row-reverse;align-items:center;gap:8px;margin-bottom:8px}
  .opt input[type=radio]{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:3px solid var(--box);border-radius:50%;margin:0;flex:none}
  .opt input[type=radio]:checked{border-color:var(--purple);box-shadow:inset 0 0 0 4px #fff,inset 0 0 0 12px var(--purple)}
  .pick{display:block;border:3px dashed var(--box);border-radius:9px;padding:16px;text-align:center;font-size:17px;color:var(--purple);font-weight:700;cursor:pointer}
  .pick input{display:none}
  .bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:var(--purple);width:0}
  .preview img{display:block;width:100%;border-radius:6px;margin-top:6px}
  .btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
  .pane-empty{color:var(--muted);text-align:center;padding:60px 20px;border:3px dashed var(--line);border-radius:9px}
  .pane h2{font-size:20px;margin:0 0 10px;line-height:1.4}
  .pane video,.pane img{display:block;width:100%;max-height:70vh;border-radius:9px;background:#000}
  .pane img{background:transparent}
  .box.focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--soft)}
  /* מחשב: רוחב מלא, רשתות, ומסך מפוצל (רשימה מימין, תצוגה משמאל) */
  @media (min-width:1000px){
    main{max-width:1320px}
    .panel{padding:28px 24px 48px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 16px;margin-bottom:8px}
    .grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid .row{margin-bottom:0}
    .actions{display:flex;flex-wrap:wrap;gap:12px}
    .actions .btn{width:auto;min-width:240px;padding-inline:28px}
    .split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
    .pane{position:sticky;top:84px}
    .narrow{max-width:680px}
  }
  /* לשוניות עליונות, כמו במאגר הליקויים של datanets */
  .tabs{display:flex;margin:0 12px;border-inline:1px solid transparent}
  .tabs button{flex:1;padding:14px 4px;font-size:16px;text-align:center;color:var(--ink);white-space:nowrap}
  .tabs button.on{background:#cbcbd1}
  .box .kind{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .box small.ltr{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side.many{gap:0} .side.many .ic{width:30px}
  /* כרטיס מבחן: שם ומייל, ומתחתיו שורת כפתורים עם מילים */
  .test{border:3px solid var(--box);border-radius:9px;background:var(--bg);margin-bottom:10px;overflow:hidden}
  .test-head{display:flex;align-items:flex-start;gap:8px;padding:11px 12px 8px}
  .test-title{flex:1;min-width:0;font-size:18px;font-weight:700}
  .test-title small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .test-del{width:34px;height:34px;display:grid;place-items:center;flex:none;margin:-4px -4px 0 0}
  .test-del svg{width:20px;height:20px;fill:var(--icon)}
  .test-acts{display:flex;border-top:1.5px solid var(--line)}
  .ta{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 4px;font-size:15px;font-weight:700;color:#444}
  .ta + .ta{border-inline-start:1.5px solid var(--line)}
  .ta svg{width:17px;height:17px;fill:currentColor}
  .ta.main{color:var(--purple)}
  @media (min-width:1000px){.grid .test{margin-bottom:0}}
  /* כרטיסים: תחום, תת־תחום, סרטון ושאלותיו, פריט בסידור, הגשה */
  .card{display:block;width:100%;text-align:right;border:3px solid var(--box);border-radius:9px;background:var(--bg);margin-bottom:10px;overflow:hidden;cursor:pointer}
  .card.on{border-color:var(--purple)}
  .card.focus{border-color:var(--purple);box-shadow:0 0 0 3px var(--soft)}
  .card.dragging{border-color:var(--purple);box-shadow:0 6px 18px rgba(0,0,0,.15)}
  .ch-row{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer}
  .ch-row .t{flex:1;min-width:0;font-size:18px;font-weight:700}
  .ch-row .t small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
  .ch-row.sm .t{font-size:16px;font-weight:600}
  .chev{color:var(--icon);font-size:26px;line-height:1;flex:none}
  .cnt{background:var(--purple);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;flex:none}
  .qrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1.5px solid var(--line);font-size:16px;cursor:pointer}
  .qrow .t{flex:1;min-width:0}
  .qrow .t small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
  .qrow.focus,.ch-row.focus{background:var(--soft)}
  .vthumb{width:54px;height:38px;border-radius:6px;background:#3a3a44;color:#fff;display:grid;place-items:center;flex:none;font-size:14px}
  .card .preview{padding:0 12px 12px}
  .card .ic{flex:none}
  .score{font-size:22px;font-weight:800}
  @media (min-width:1000px){.grid .card{margin-bottom:0}}
  /* תוצאות */
  .res-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .res-filters .field{flex:1 1 220px;width:auto;padding:8px 10px;font-size:16px}
  .score{font-size:22px;font-weight:700;color:var(--purple);flex:none;min-width:58px;text-align:center}
  .score.low{color:var(--bad)}
  .who{font-weight:700}
  .mt{color:var(--muted)} .mt.bad{color:var(--bad);font-weight:700}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:0 0 14px}
  .kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
  .catrow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:15px}
  .catrow .nm{flex:0 0 120px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .catrow .bar{flex:1;margin:0} .catrow .p{flex:0 0 42px;text-align:left;font-weight:700}
  .qa{border-top:1px solid var(--line);padding:8px 0;font-size:15px;display:flex;gap:8px}
  .qa > div{min-width:0}
  .qa .mk{flex:none;width:22px;font-weight:700}
  .qa .mk.y{color:var(--purple)} .qa .mk.n{color:var(--bad)} .qa .mk.o{color:var(--muted)}
  .qa .a{color:#444;margin-top:2px;overflow-wrap:anywhere} .qa .a b{font-weight:400;color:var(--muted)}
  .vrow{font-size:14px;color:#444;margin:3px 0}
  .topbar .link + .link{margin-inline-start:14px}
  .hidden{display:none!important}
</style>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U = path => SETTINGS.databaseURL + path + '.json';
const CODE_CHARS = 'abcdefghjkmnpqrstuvwxyz23456789';
const newCode = () => Array.from({ length: 6 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
const newId = () => Math.random().toString(36).slice(2, 8);
const inviteLink = (id, c) => new URL('index.html?q=' + id + '-' + c, location.href).href;
const validEmail = s => /^\S+@\S+\.\S+$/.test(s || '');
const icon = (name, act, data) => '<button class="ic" data-act="' + act + '"' + (data || '') + '><svg><use href="#i-' + name + '"/></svg></button>';
const keepScroll = fn => { const y = scrollY; fn(); scrollTo(0, y); };
const STORAGE = 'https://firebasestorage.googleapis.com/v0/b/' + SETTINGS.storageBucket + '/o';
const CHUNK = 2 * 1024 * 1024;
const resolveSrc = window.resolveVideoSrc || (u => u);
const isImg = v => (v && v.kind) === 'image';
const WIDE = matchMedia('(min-width: 1000px)');
const wide = () => WIDE.matches;
const fmtDur = s => s ? Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0') : '';

let token = null, quizzes = {}, globalEmail = '';
let catalog = { cats: {}, videos: {}, questions: {} };
let draft = null;                 // מבחן בבנייה: { id, title, email, items: ['v:..'|'q:..'], snap: {key: item} }
let view = 'login', curCat = null, curSub = null;
const expanded = new Set();       // פריטים שהתצוגה המקדימה שלהם פתוחה
let form = null;
let focusKey = null;              // במחשב: הפריט שמוצג בחלון התצוגה                  // טופס פתוח: הוספה/עריכה של סרטון־תמונה או של שאלה

function sessionSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
function sessionGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

// ---------- כניסה (הסיסמה לא נשמרת; נשמר רק refresh token של פיירבייס ללשונית הזו) ----------
async function login(email, password) {
  const res = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + SETTINGS.apiKey, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, returnSecureToken: true }),
  });
  const j = await res.json();
  if (!res.ok) throw new Error(j.error && j.error.message);
  if (j.refreshToken) sessionSet('rt', j.refreshToken);
  return j.idToken;
}
async function relogin() {
  const rt = sessionGet('rt');
  if (!rt) throw new Error('auth');
  const res = await fetch('https://securetoken.googleapis.com/v1/token?key=' + SETTINGS.apiKey, {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(rt),
  });
  const j = await res.json();
  if (!res.ok || !(j.id_token || j.idToken)) throw new Error('auth');
  token = j.id_token || j.idToken;
  return token;
}
async function api(method, path, body) {
  const go = () => fetch(U(path) + '?auth=' + encodeURIComponent(token), {
    method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body),
  });
  let res = await go();
  if (res.status === 401) { await relogin(); res = await go(); }
  if (!res.ok) throw new Error(res.status);
  return res;
}
const pub = async path => (await (await fetch(U(path), { cache: 'no-store' })).json()) || null;

async function load() {
  const [q, c, e] = await Promise.all([pub('/quizzes'), pub('/library/catalog'), pub('/settings/resultsEmail')]);
  quizzes = q || {};
  catalog = Object.assign({ cats: {}, videos: {}, questions: {} }, c || {});
  globalEmail = e || '';
  go('tests');
}

// ---------- הקטלוג: קטגוריה ‹ תת־קטגוריה ‹ סרטון ‹ שאלות ----------
const byOrder = (a, b) => (a[1].order || 0) - (b[1].order || 0) || String(a[1].name || a[1].title).localeCompare(String(b[1].name || b[1].title), 'he');
const cats = () => Object.entries(catalog.cats || {}).sort(byOrder);
const subs = cid => Object.entries((catalog.cats[cid] || {}).subs || {}).sort(byOrder);
const videosIn = (cid, sid) => Object.entries(catalog.videos || {}).filter(([, v]) => v.cat === cid && v.sub === sid).sort(byOrder);
const questionsOf = vid => Object.entries(catalog.questions || {}).filter(([, q]) => q.video === vid).sort(byOrder);
const catName = cid => (catalog.cats[cid] || {}).name || '';
const subName = (cid, sid) => (((catalog.cats[cid] || {}).subs || {})[sid] || {}).name || '';
function pickedIn(cid, sid) {
  if (!draft) return 0;
  return draft.items.filter(k => {
    const id = k.slice(2), vid = k[0] === 'v' ? id : (catalog.questions[id] || {}).video, v = catalog.videos[vid];
    return v && v.cat === cid && (!sid || v.sub === sid);
  }).length;
}
// כל הסרטונים והשאלות של תחום (ותת־תחום), סרטון לפני השאלות שלו
function keysIn(cid, sid) {
  const out = [];
  subs(cid).filter(([s]) => !sid || s === sid).forEach(([s]) =>
    videosIn(cid, s).forEach(([vid]) => { out.push('v:' + vid); questionsOf(vid).forEach(([qid]) => out.push('q:' + qid)); }));
  return out;
}
const groupState = keys => { const n = keys.filter(k => draft.items.includes(k)).length; return !n ? '' : n === keys.length ? ' on' : ' part'; };

const two = n => String(n).padStart(2, '0');
const fmtWhen = t => { if (!t) return ''; const d = new Date(t); return two(d.getDate()) + '.' + two(d.getMonth() + 1) + ' · ' + two(d.getHours()) + ':' + two(d.getMinutes()); };
const fmtFull = t => { if (!t) return '—'; const d = new Date(t); return two(d.getDate()) + '.' + two(d.getMonth() + 1) + '.' + d.getFullYear() + ' · ' + two(d.getHours()) + ':' + two(d.getMinutes()); };
const minsOf = r => r.at && r.startedAt ? Math.max(0, Math.round((r.at - r.startedAt) / 60000)) : null;

const pctOf = r => typeof r.pct === 'number' ? r.pct : (r.total ? Math.round((r.right || 0) / r.total * 100) : null);
const MAIL = { sent: 'מייל נשלח', failed: 'מייל לא נשלח', pending: 'מייל לא אושר' };

function resultRow(r) {

    esc(quizTitle(r)) + '<br>' + fmtWhen(r.at) + (m === null ? '' : ' · ' + m + ' דק׳') +

    '<span class="score' + (p !== null && p < 60 ? ' low' : '') + '">' + (p === null ? '—' : p + '%') + '</span></div></button>';

  return it ? it.options[(it.correct || 1) - 1] : '';

function resultDetail(r) {

// קובץ CSV שנפתח באקסל בעברית (BOM בתחילתו): שורה לכל הגשה, לפי הסינון שעל המסך
function exportResults() {
  const list = filteredResults();
  if (!list.length) return alert('אין הגשות לייצוא.');
  const catNames = [...new Set(list.flatMap(r => (r.cats || []).map(c => c.name)))];
  const cell = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const head = ['שם העובד', 'מבחן', 'תאריך', 'שעת התחלה', 'משך (דקות)', 'ציון %', 'נכונות', 'מתוך', 'שאלות פתוחות', 'צפייה חוזרת בסרטונים', 'מייל']
    .concat(catNames.map(n => 'ציון ' + n + ' %'));
  const rows = list.map(r => {
    const d = r.at ? new Date(r.at) : null, s = r.startedAt ? new Date(r.startedAt) : null;
    const cats = {}; (r.cats || []).forEach(c => { cats[c.name] = c.total ? Math.round(c.right / c.total * 100) : ''; });
    return [r.name, quizTitle(r), d ? two(d.getDate()) + '.' + two(d.getMonth() + 1) + '.' + d.getFullYear() : '',
      s ? two(s.getHours()) + ':' + two(s.getMinutes()) : '', minsOf(r), pctOf(r), r.right, r.total,
      (r.answers || []).filter(a => a.ok === 'open').length, (r.views || []).filter(v => v.n > 1).length,
      r.mail === 'sent' ? 'נשלח' : 'לא נשלח'].concat(catNames.map(n => cats[n] === undefined ? '' : cats[n]));
  });
  const csv = '﻿' + [head].concat(rows).map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const t = new Date();
  a.download = 'results-' + t.getFullYear() + '-' + two(t.getMonth() + 1) + '-' + two(t.getDate()) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

async function storageFetch(url, opts) {
  const go = () => {
    const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 90000);
    return fetch(url, Object.assign({}, opts, { signal: ctl.signal, headers: Object.assign({ Authorization: 'Firebase ' + token }, opts.headers) }))
      .finally(() => clearTimeout(timer));
  };
  let res = await go();
  if (res.status === 401) { await relogin(); res = await go(); }
  return res;
}
// העלאה בחתיכות של 2MB; אחרי נפילת רשת שואלים כמה התקבל וממשיכים משם
async function uploadFile(file, path, onProgress) {
  const type = file.type || 'application/octet-stream';
  const start = await storageFetch(STORAGE + '?name=' + encodeURIComponent(path), {
    method: 'POST',
    headers: { 'X-Goog-Upload-Protocol': 'resumable', 'X-Goog-Upload-Command': 'start',
               'X-Goog-Upload-Header-Content-Length': String(file.size), 'X-Goog-Upload-Header-Content-Type': type,
               'Content-Type': 'application/json; charset=utf-8' },
    body: JSON.stringify({ name: path, contentType: type }),
  });
  const uploadUrl = start.headers.get('X-Goog-Upload-URL');
  if (!start.ok || !uploadUrl) throw new Error('start ' + start.status);
  let offset = 0, fails = 0, result = null;
  while (!result) {
    const end = Math.min(offset + CHUNK, file.size), last = end === file.size;
    try {
      const res = await storageFetch(uploadUrl, {
        method: 'POST', headers: { 'X-Goog-Upload-Command': last ? 'upload, finalize' : 'upload', 'X-Goog-Upload-Offset': String(offset) },
        body: file.slice(offset, end),
      });
      if (!res.ok) throw new Error('chunk ' + res.status);
      if (last) result = await res.json();
      offset = end; fails = 0;
    } catch (err) {
      if (++fails > 6) throw err;
      await new Promise(r => setTimeout(r, 1000 * 2 ** fails));
      const q = await storageFetch(uploadUrl, { method: 'POST', headers: { 'X-Goog-Upload-Command': 'query' } }).catch(() => null);
      const got = q && q.headers.get('X-Goog-Upload-Size-Received');
      if (got != null) offset = +got;
    }
    onProgress(Math.floor(offset / file.size * 100));
  }
  return STORAGE + '/' + encodeURIComponent(path) + '?alt=media&token=' + result.downloadTokens;
}
const videoDuration = file => new Promise(ok => {
  const v = document.createElement('video'), u = URL.createObjectURL(file);
  v.preload = 'metadata';
  v.onloadedmetadata = () => { ok(Math.round(v.duration) || 0); URL.revokeObjectURL(u); };
  v.onerror = () => { ok(0); URL.revokeObjectURL(u); };

});
async function saveMedia() {
  const err = m => { $('mErr').textContent = m; };

  if (!form.title) return err('צריך שם.');

  if (!f) return err('צריך לבחור קובץ.');

  const ext = (f.name.match(/\.([a-z0-9]+)$/i) || [, image ? 'jpg' : 'mp4'])[1].toLowerCase();
  const path = (image ? 'images/' : 'videos/') + Date.now() + '-' + newId() + '.' + ext;

    const vid = 'm' + Date.now().toString(36) + newId();

// גרירה לשינוי סדר. עובד באצבע ובעכבר; גלילה אוטומטית ליד קצה המסך.
function startDrag(e, row) {
  e.preventDefault();
  const list = $('orderList');
  row.classList.add('dragging');
  let lastY = e.clientY, timer = null;
  const place = y => {
    const others = [...list.children].filter(r => r !== row);
    const before = others.find(r => { const b = r.getBoundingClientRect(); return y < b.top + b.height / 2; });
    if (before) list.insertBefore(row, before); else list.appendChild(row);
  };
  const move = ev => { lastY = ev.clientY; place(lastY); };
  timer = setInterval(() => {
    if (lastY < 90) scrollBy(0, -12); else if (lastY > innerHeight - 60) scrollBy(0, 12); else return;
    place(lastY);
  }, 30);
  const up = () => {
    clearInterval(timer);
    removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
    row.classList.remove('dragging');
    draft.items = [...list.children].map(r => r.dataset.key);
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
}
$('panel').addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]');
  if (h) startDrag(e, h.closest('[data-key]'));
});

function toggleItem(key) {
  const i = draft.items.indexOf(key);
  if (i > -1) { draft.items.splice(i, 1); return; }
  const id = key.slice(2), vid = key[0] === 'v' ? id : (catalog.questions[id] || {}).video;
  const mine = k => k === 'v:' + vid || (k[0] === 'q' && (catalog.questions[k.slice(2)] || {}).video === vid);
  if (key[0] === 'v') {
    const first = draft.items.findIndex(mine);
    if (first > -1) return draft.items.splice(first, 0, key);
  } else {
    let last = -1; draft.items.forEach((k, j) => { if (mine(k)) last = j; });
    if (last > -1) return draft.items.splice(last + 1, 0, key);
  }
  draft.items.push(key);
}

async function send(id) {
  const q = quizzes[id];
  if (!(q.items || q.topics || []).length) return alert('המבחן ריק. ערוך אותו קודם.');
  if (!validEmail(q.email || globalEmail)) return alert('אין מייל לתוצאות. ערוך את המבחן והוסף מייל.');
  const code = newCode();
  try { await api('PATCH', '/invites/' + id, { [code]: { created: Date.now(), sent: Date.now() } }); }
  catch (e) { return alert('היצירה נכשלה. בדוק אינטרנט ונסה שוב.'); }
  open('https://wa.me/?text=' + encodeURIComponent(q.title + '\n' + inviteLink(id, code)), '_blank');
}
async function del(id) {
  if (!confirm('למחוק את "' + quizzes[id].title + '"? הקישורים שלו יפסיקו לעבוד, וההגשות שלו יימחקו.')) return;
  try { await api('DELETE', '/quizzes/' + id); } catch (e) { return alert('המחיקה נכשלה. נסה שוב.'); }
  ['/submissions/', '/invites/', '/done/'].forEach(p => api('DELETE', p + id).catch(() => {}));
  delete quizzes[id]; renderTests();
}

async function rename(path, current, label) {
  const name = (prompt(label, current) || '').trim();
  if (!name || name === current) return null;
  try { await api('PATCH', path, { name }); return name; } catch (e) { alert('השמירה נכשלה. נסה שוב.'); return null; }
}
async function addNode(path, label) {
  const name = (prompt(label) || '').trim();
  if (!name) return null;
  const node = { name, order: Date.now() };
  try { await api('PUT', path, node); return node; } catch (e) { alert('השמירה נכשלה. נסה שוב.'); return null; }
}
async function seed() {
  try {
    const data = await (await fetch('catalog.json?v=' + Date.now())).json();
    if (Object.keys(catalog.cats || {}).length) return;
    await api('PUT', '/library/catalog', data);
    catalog = Object.assign({ cats: {}, videos: {}, questions: {} }, data);
    renderCats();
  } catch (e) { alert('הטעינה נכשלה. בדוק אינטרנט ונסה שוב.'); }
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el || !el.dataset.act) return;
  const d = el.dataset;
  switch (d.act) {
    case 'login': {
      $('loginErr').textContent = ''; el.disabled = true;
      try { token = await login($('email').value.trim(), $('pass').value); await load(); }
      catch (err) { $('loginErr').textContent = 'אימייל או סיסמה לא נכונים.'; el.disabled = false; }
      break;
    }
    case 'logout': sessionSet('rt', ''); token = null; draft = null; go('login'); break;
    case 'settings': draft = null; go('cats'); break;
    case 'newTest': startDraft(null); go('cats'); break;
    case 'edit': startDraft(d.id); go('cats'); break;
    case 'send': send(d.id); break;
    case 'results': subsList = null; resKey = null; go('results'); break;
    case 'backResults': go('results'); break;
    case 'back': history.state && history.length > 1 ? history.back() : go(draft ? 'cats' : 'tests'); break;
    case 'exportResults': exportResults(); break;
    case 'resultsOf': subsList = null; resKey = null; resQuiz = d.id; resQ = ''; go('results'); break;
    case 'openResult':
      resKey = d.key;
      if (wide()) keepScroll(paintResultList); else go('result');
      break;
    case 'delete': del(d.id); break;
    case 'toTests': if (leaveDraft()) go('tests'); break;
    case 'toCats': go('cats'); break;
    case 'toSubs': go('subs'); break;
    case 'openCat': curCat = d.cid; go('subs'); break;
    case 'openSub': curSub = d.sid; go('items'); break;
    case 'toOrder': go('order'); break;
    case 'save': save(); break;
    case 'seed': seed(); break;
    case 'item':
      if (e.target.closest('.preview')) return;   // לחיצה בתוך הנגן/התשובות לא סוגרת
      if (wide()) focusKey = d.key;
      else expanded.has(d.key) ? expanded.delete(d.key) : expanded.add(d.key);
      keepScroll(renderItems); break;
    case 'pick':
      toggleItem(d.key); keepScroll(renderItems); break;
    case 'backItems': form = null; go('items'); break;
    case 'newMedia': form = { id: null, title: '', file: null }; go('media'); break;
    case 'editMedia': { const id = d.key.slice(2); form = { id, title: catalog.videos[id].title }; go('media'); break; }
    case 'saveMedia': saveMedia(); break;
    case 'delMedia': delMedia(); break;
    case 'newQ': {
      const vids = videosIn(curCat, curSub);
      const open = vids.find(([vid]) => expanded.has('v:' + vid));
      form = { id: null, video: (open || vids[0])[0], type: 'choice', text: '', options: ['', '', '', ''], correct: 0 };
      go('question'); break;
    }
    case 'editQ': {
      const id = d.key.slice(2), q = catalog.questions[id];
      form = { id, video: q.video, type: q.type, text: q.text, options: (q.options || ['', '', '', '']).slice(), correct: q.correct || 0 };
      go('question'); break;
    }
    case 'qType': form.type = d.type; keepScroll(renderQuestionForm); break;
    case 'qAddOpt': form.options.push(''); keepScroll(renderQuestionForm); break;
    case 'saveQ': saveQ(); break;
    case 'delQ': delQ(); break;
    case 'pickAll': toggleGroup(keysIn(curCat, curSub)); keepScroll(renderItems); break;
    case 'pickCat': toggleGroup(keysIn(d.cid)); keepScroll(renderCats); break;
    case 'pickSub': toggleGroup(keysIn(curCat, d.sid)); keepScroll(renderSubs); break;
    case 'renameCat': {
      const n = await rename('/library/catalog/cats/' + d.cid, catName(d.cid), 'שם הקטגוריה:');
      if (n) { catalog.cats[d.cid].name = n; renderCats(); }
      break;
    }
    case 'renameSub': {
      const n = await rename('/library/catalog/cats/' + curCat + '/subs/' + d.sid, subName(curCat, d.sid), 'שם תת־הקטגוריה:');
      if (n) { catalog.cats[curCat].subs[d.sid].name = n; renderSubs(); }
      break;
    }
    case 'addCat': {
      const cid = 'c' + newId(), node = await addNode('/library/catalog/cats/' + cid, 'שם הקטגוריה החדשה:');
      if (node) { catalog.cats[cid] = node; renderCats(); }
      break;
    }
    case 'addSub': {
      const sid = 's' + newId(), node = await addNode('/library/catalog/cats/' + curCat + '/subs/' + sid, 'שם תת־הקטגוריה החדשה:');
      if (node) { (catalog.cats[curCat].subs = catalog.cats[curCat].subs || {})[sid] = node; renderSubs(); }
      break;
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && view === 'login') document.querySelector('[data-act="login"]').click();
  else if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
addEventListener('beforeunload', e => { if (draft && draft.items.length) { e.preventDefault(); e.returnValue = ''; } });

WIDE.addEventListener('change', () => { if (['tests', 'cats', 'subs', 'items', 'order', 'results'].includes(view)) keepScroll(() => go(view)); });
go('login');
(async () => {
  if (!sessionGet('rt')) return;
  try { await relogin(); await load(); } catch (e) {}
})();
</script>
</body>
</html>

<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול המבחנים — מבנים</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f0f0f6; --top:#ffffff; --ink:#111; --muted:#777; --box:#7a7a7a;
    --purple:#7458c4; --soft:#ece8f8; --icon:#9a9a9a; --line:#d4d4da; --bad:#d23c3c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);font:16px/1.4 Arial,Helvetica,sans-serif;color:var(--ink)}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

  .topbar{position:sticky;top:0;z-index:5;background:var(--top);display:flex;align-items:center;gap:10px;
          padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex:none}
  .avatar svg{width:22px;height:22px;fill:var(--purple)}
  .brand{font-weight:700;font-size:20px;color:#666;flex:none}
  .sep{width:1px;height:28px;background:#ddd;flex:none}
  .sub{color:#999;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .link{font-weight:700;font-size:17px;white-space:nowrap;flex:none}
  .link::after{content:" ‹";font-size:22px}

  main{max-width:720px;margin:0 auto}
  .panel{margin:0 12px;border-inline:1px solid var(--line);min-height:calc(100vh - 64px);padding:20px 10px 40px}
  h1{font-size:24px;margin:0 0 18px;line-height:1.5}
  h1 a{color:var(--ink);text-decoration:underline;font-weight:400;cursor:pointer}
  h1 .ch{font-weight:400;margin:0 6px}

  .row{display:flex;flex-direction:row-reverse;align-items:center;gap:8px;margin-bottom:10px}
  .box{flex:1;min-width:0;border:3px solid var(--box);border-radius:9px;padding:11px 12px;font-size:18px;min-height:50px;
       display:flex;align-items:center;gap:10px;background:var(--bg);text-align:right;width:100%}
  .box > div{min-width:0;flex:1}
  .box.on{border-color:var(--purple)}
  .box small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
  .box small.ltr{direction:ltr;text-align:right}
  .side{display:flex;gap:4px;flex:none;align-items:center}
  .ic{width:34px;height:34px;display:grid;place-items:center}
  .ic svg{width:20px;height:20px;fill:var(--icon)}
  .chk{width:26px;height:26px;border:3px solid var(--box);border-radius:5px;display:grid;place-items:center;flex:none}
  .chk.on{background:var(--purple);border-color:var(--purple)}
  .chk.on::after{content:"✓";color:#fff;font-size:15px;font-weight:700}
  .drag{color:var(--icon);font-size:24px;width:34px;height:40px;display:grid;place-items:center;touch-action:none;cursor:grab}
  .row.dragging .box{border-color:var(--purple);box-shadow:0 6px 18px rgba(0,0,0,.15)}
  .tag{font-size:12px;color:var(--muted);border:1.5px solid var(--box);border-radius:5px;padding:0 6px;flex:none}
  .group{font-weight:700;margin:18px 0 8px;font-size:17px}
  .count{color:var(--purple);font-weight:700}
  .opts{margin:6px 0 0;padding:0 18px 0 0;font-size:15px;color:#444}
  .box.item{flex-wrap:wrap;cursor:pointer}
  .box > .preview{flex:0 0 100%;cursor:default}
  .preview video{display:block;width:100%;max-height:60vh;border-radius:6px;background:#000;margin-top:6px}
  .opts li.ok{font-weight:700;color:var(--purple)}

  .btn{display:block;width:100%;background:var(--purple);color:#fff;border:3px solid var(--purple);border-radius:9px;
       padding:11px;font-size:18px;font-weight:700;text-align:center;margin-top:8px}
  .btn.ghost{background:transparent;color:var(--purple)}
  .btn:disabled{opacity:.5}
  .field{width:100%;font:inherit;font-size:18px;border:3px solid var(--box);border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink)}
  .field:focus{outline:0;border-color:var(--purple)}
  .field.ltr{direction:ltr;text-align:right}
  label.f{display:block;font-weight:700;margin:14px 0 6px}
  .muted{color:var(--muted);font-size:14px}
  .err{color:var(--bad);font-weight:700;margin:10px 0 0}
  .foot{margin-top:28px;text-align:center}
  .foot button{color:var(--muted);text-decoration:underline;font-size:14px}
  .hidden{display:none!important}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm17.71-10.21a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></symbol>
  <symbol id="i-del" viewBox="0 0 24 24"><path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-9 2-9 5v3h18v-3c0-3-5-5-9-5z"/></symbol>
</svg>

<div class="topbar">
  <div class="avatar"><svg><use href="#i-user"/></svg></div>
  <div class="brand">מבנים</div>
  <div class="sep" id="tbSep"></div>
  <div class="sub" id="tbSub"></div>
  <button class="link" id="tbLink"></button>
</div>
<main><div class="panel" id="panel"></div></main>

<script src="settings.js?v=41"></script>
<script src="demo.js?v=41"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U = path => SETTINGS.databaseURL + path + '.json';
const CODE_CHARS = 'abcdefghjkmnpqrstuvwxyz23456789';
const newCode = () => Array.from({ length: 6 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
const newId = () => Math.random().toString(36).slice(2, 8);
const inviteLink = (id, c) => new URL('index.html?q=' + id + '-' + c, location.href).href;
const validEmail = s => /^\S+@\S+\.\S+$/.test(s || '');
const icon = (name, act, data) => '<button class="ic" data-act="' + act + '"' + (data || '') + '><svg><use href="#i-' + name + '"/></svg></button>';
const keepScroll = fn => { const y = scrollY; fn(); scrollTo(0, y); };
const fmtDur = s => s ? Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0') : '';

let token = null, quizzes = {}, globalEmail = '';
let catalog = { cats: {}, videos: {}, questions: {} };
let draft = null;                 // מבחן בבנייה: { id, title, email, items: ['v:..'|'q:..'], snap: {key: item} }
let view = 'login', curCat = null, curSub = null;
const expanded = new Set();       // שאלות שפתוחות לצפייה בתשובות (מצב ניהול)

function sessionSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} }
function sessionGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

// ---------- כניסה (הסיסמה לא נשמרת; נשמר רק refresh token של פיירבייס ללשונית הזו) ----------
async function login(email, password) {
  const res = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + SETTINGS.apiKey, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, returnSecureToken: true }),
  });
  const j = await res.json();
  if (!res.ok) throw new Error(j.error && j.error.message);
  if (j.refreshToken) sessionSet('rt', j.refreshToken);
  return j.idToken;
}
async function relogin() {
  const rt = sessionGet('rt');
  if (!rt) throw new Error('auth');
  const res = await fetch('https://securetoken.googleapis.com/v1/token?key=' + SETTINGS.apiKey, {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(rt),
  });
  const j = await res.json();
  if (!res.ok || !(j.id_token || j.idToken)) throw new Error('auth');
  token = j.id_token || j.idToken;
  return token;
}
async function api(method, path, body) {
  const go = () => fetch(U(path) + '?auth=' + encodeURIComponent(token), {
    method, headers: { 'Content-Type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body),
  });
  let res = await go();
  if (res.status === 401) { await relogin(); res = await go(); }
  if (!res.ok) throw new Error(res.status);
  return res;
}
const pub = async path => (await (await fetch(U(path), { cache: 'no-store' })).json()) || null;

async function load() {
  const [q, c, e] = await Promise.all([pub('/quizzes'), pub('/library/catalog'), pub('/settings/resultsEmail')]);
  quizzes = q || {};
  catalog = Object.assign({ cats: {}, videos: {}, questions: {} }, c || {});
  globalEmail = e || '';
  go('tests');
}

// ---------- הקטלוג: קטגוריה ‹ תת־קטגוריה ‹ סרטון ‹ שאלות ----------
const byOrder = (a, b) => (a[1].order || 0) - (b[1].order || 0) || String(a[1].name || a[1].title).localeCompare(String(b[1].name || b[1].title), 'he');
const cats = () => Object.entries(catalog.cats || {}).sort(byOrder);
const subs = cid => Object.entries((catalog.cats[cid] || {}).subs || {}).sort(byOrder);
const videosIn = (cid, sid) => Object.entries(catalog.videos || {}).filter(([, v]) => v.cat === cid && v.sub === sid).sort(byOrder);
const questionsOf = vid => Object.entries(catalog.questions || {}).filter(([, q]) => q.video === vid).sort(byOrder);
const catName = cid => (catalog.cats[cid] || {}).name || '';
const subName = (cid, sid) => (((catalog.cats[cid] || {}).subs || {})[sid] || {}).name || '';
function countIn(cid, sid) {
  const vs = Object.entries(catalog.videos || {}).filter(([, v]) => v.cat === cid && (!sid || v.sub === sid)).map(([k]) => k);
  const qs = Object.values(catalog.questions || {}).filter(q => vs.includes(q.video)).length;
  return vs.length + ' סרטונים · ' + qs + ' שאלות';
}
// פריט מלא לפי מפתח. אם נמחק מהקטלוג — העותק שנשמר במבחן.
function itemOf(key) {
  const [k, id] = [key[0], key.slice(2)];
  if (k === 'v' && catalog.videos[id]) {
    const v = catalog.videos[id];
    return { key, k: 'v', title: v.title, url: v.url, duration: v.duration || 0, cat: catName(v.cat), sub: subName(v.cat, v.sub) };
  }
  if (k === 'q' && catalog.questions[id]) {
    const q = catalog.questions[id], v = catalog.videos[q.video] || {};
    const o = { key, k: 'q', type: q.type, text: q.text, cat: catName(v.cat), sub: subName(v.cat, v.sub) };
    if (q.type === 'choice') { o.options = q.options; o.correct = q.correct; }
    return o;
  }
  return draft && draft.snap[key] || null;
}

// ---------- מבנה המסך ----------
function topbar(sub, linkText, linkAct) {
  $('tbSub').textContent = sub || '';
  $('tbSep').classList.toggle('hidden', !sub);
  $('tbLink').textContent = linkText || '';
  $('tbLink').classList.toggle('hidden', !linkText);
  $('tbLink').dataset.act = linkAct || '';
}
function go(v) {
  view = v;
  ({ login: renderLogin, tests: renderTests, cats: renderCats, subs: renderSubs, items: renderItems, order: renderOrder })[v]();
  scrollTo(0, 0);
}
const draftSub = () => draft ? (draft.title || (draft.id ? 'מבחן' : 'מבחן חדש')) : 'הגדרות';
function selSummary() {
  if (!draft) return '';
  const v = draft.items.filter(k => k[0] === 'v').length, q = draft.items.length - v;
  return '<div class="row"><div class="box" style="font-size:16px">נבחרו עד עכשיו:&nbsp;<span class="count">' +
         v + ' סרטונים · ' + q + ' שאלות</span></div></div>';
}
const buildButtons = () => draft
  ? '<button class="btn" data-act="toOrder"' + (draft.items.length ? '' : ' disabled') + '>צור מבחן</button>' : '';

function renderLogin() {
  topbar('', '', '');
  $('panel').innerHTML =
    '<h1>כניסת מנהל</h1>' +
    '<label class="f">אימייל</label><input class="field ltr" id="email" type="email" autocomplete="username">' +
    '<label class="f">סיסמה</label><input class="field ltr" id="pass" type="password" autocomplete="current-password">' +
    '<button class="btn" data-act="login" style="margin-top:18px">כניסה</button><p class="err" id="loginErr"></p>';
}

// ---------- דף 1: מבחנים ----------
function renderTests() {
  topbar('', 'הגדרות', 'settings');
  const ids = Object.keys(quizzes).sort((a, b) => (quizzes[b].updated || 0) - (quizzes[a].updated || 0));
  $('panel').innerHTML = '<h1>מבחנים</h1>' +
    (ids.length ? '' : '<p class="muted">עוד אין מבחנים.</p>') +
    ids.map(id => {
      const q = quizzes[id], mail = q.email || globalEmail;
      return '<div class="row"><div class="side">' +
        icon('send', 'send', ' data-id="' + id + '"') + icon('pen', 'edit', ' data-id="' + id + '"') + icon('del', 'delete', ' data-id="' + id + '"') +
        '</div><div class="box"><div>' + esc(q.title || 'ללא שם') +
        '<small class="ltr">' + esc(mail || 'לא הוגדר מייל לתוצאות') + '</small></div></div></div>';
    }).join('') +
    '<button class="btn" data-act="newTest">הוסף מבחן</button>' +
    '<div class="foot"><span class="muted">גרסה 41 · </span><button data-act="logout">יציאה</button></div>';
}

// ---------- דף 2: קטגוריות ----------
function renderCats() {
  topbar(draftSub(), 'לכל המבחנים', 'toTests');
  const list = cats();
  $('panel').innerHTML = '<h1>קטגוריות <span class="ch">‹</span></h1>' + selSummary() +
    (list.length ? '' : '<p class="muted">הקטלוג ריק.</p><button class="btn ghost" data-act="seed">טעינת הקטלוג הראשוני</button>') +
    list.map(([cid, c]) => '<div class="row"><div class="side">' + icon('pen', 'renameCat', ' data-cid="' + cid + '"') +
      '</div><button class="box" data-act="openCat" data-cid="' + cid + '"><div>' + esc(c.name) +
      '<small>' + countIn(cid) + '</small></div></button></div>').join('') +
    '<button class="btn ghost" data-act="addCat">הוסף</button>' + buildButtons();
}

// ---------- דף 3: תת־קטגוריות ----------
function renderSubs() {
  topbar(draftSub(), 'לכל המבחנים', 'toTests');
  $('panel').innerHTML = '<h1><a data-act="toCats">קטגוריות</a> <span class="ch">‹</span> ' + esc(catName(curCat)) + ' <span class="ch">‹</span></h1>' +
    selSummary() +
    subs(curCat).map(([sid, s]) => '<div class="row"><div class="side">' + icon('pen', 'renameSub', ' data-sid="' + sid + '"') +
      '</div><button class="box" data-act="openSub" data-sid="' + sid + '"><div>' + esc(s.name) +
      '<small>' + countIn(curCat, sid) + '</small></div></button></div>').join('') +
    '<button class="btn ghost" data-act="addSub">הוסף</button>' + buildButtons();
}

// ---------- דף 3א: הסרטונים והשאלות של תת־קטגוריה ----------
// לחיצה על המסגרת פותחת תצוגה מקדימה (סרטון מתנגן / תשובות); הריבוע משמאל מסמן למבחן.
function itemRow(key, tag, text, extra, preview) {
  const on = draft && draft.items.includes(key);
  const side = draft ? '<button class="chk' + (on ? ' on' : '') + '" data-act="pick" data-key="' + key + '" aria-label="סימון למבחן"></button>' : '';
  const open = expanded.has(key);
  return '<div class="row"><div class="side">' + side + '</div>' +
    '<div class="box item' + (on ? ' on' : '') + '" data-act="item" data-key="' + key + '" role="button" tabindex="0" aria-expanded="' + open + '">' +
    '<span class="tag">' + tag + '</span><div>' + esc(text) + (extra || '') + '</div>' +
    (open ? '<div class="preview">' + preview + '</div>' : '') + '</div></div>';
}
function questionPreview(q) {
  return q.type === 'choice'
    ? '<ol class="opts">' + q.options.map((o, i) => '<li' + (i === q.correct - 1 ? ' class="ok"' : '') + '>' + esc(o) + (i === q.correct - 1 ? ' ✓' : '') + '</li>').join('') + '</ol>'
    : '<p class="opts muted">שאלה פתוחה — העובד כותב תשובה חופשית.</p>';
}
function renderItems() {
  topbar(draftSub(), 'לכל המבחנים', 'toTests');
  const vids = videosIn(curCat, curSub);
  $('panel').innerHTML = '<h1><a data-act="toCats">קטגוריות</a> <span class="ch">‹</span> <a data-act="toSubs">' +
    esc(catName(curCat)) + '</a> <span class="ch">‹</span> ' + esc(subName(curCat, curSub)) + '</h1>' + selSummary() +
    (vids.length ? '' : '<p class="muted">אין עדיין סרטונים בתת־קטגוריה הזו.</p>') +
    (vids.length ? '<p class="muted">לחיצה על פריט מציגה אותו' + (draft ? ' · הריבוע משמאל מסמן אותו למבחן' : '') + '</p>' : '') +
    vids.map(([vid, v]) => '<div class="group">' + esc(v.title) + '</div>' +
      itemRow('v:' + vid, 'סרטון', v.title, v.duration ? '<small>' + fmtDur(v.duration) + ' דקות</small>' : '',
              '<video controls playsinline preload="metadata" src="' + esc(v.url) + '"></video>') +
      questionsOf(vid).map(([qid, q]) =>
        itemRow('q:' + qid, q.type === 'choice' ? 'אמריקאית' : 'פתוחה', q.text, '', questionPreview(q))).join('')).join('') +
    (draft && vids.length ? '<button class="btn ghost" data-act="pickAll">סמן את כל מה שבתת־קטגוריה</button>' : '') +
    buildButtons() +
    (draft ? '<button class="btn ghost" data-act="toCats">הוסף שאלות מקטגוריה אחרת</button>' : '');
}

// ---------- סידור המבחן ושמירה ----------
function renderOrder() {
  topbar(draftSub(), 'לכל המבחנים', 'toTests');
  $('panel').innerHTML = '<h1>סידור המבחן</h1>' +
    '<label class="f">שם המבחן</label><input class="field" id="dTitle" value="' + esc(draft.title) + '" placeholder="למשל: מבחן ריצוף — עובדים חדשים">' +
    '<div class="group">הסדר שהעובד יראה</div><div id="orderList">' +
    draft.items.map(key => {
      const it = itemOf(key);
      if (!it) return '';
      return '<div class="row" data-key="' + key + '"><div class="side"><span class="drag" data-drag>☰</span></div>' +
        '<div class="box"><span class="tag">' + (it.k === 'v' ? 'סרטון' : it.type === 'choice' ? 'אמריקאית' : 'פתוחה') + '</span><div>' +
        esc(it.k === 'v' ? it.title : it.text) + '<small>' + esc(it.cat + ' ‹ ' + it.sub) + '</small></div></div></div>';
    }).join('') + '</div>' +
    '<p class="muted">גוררים בסימן ☰ כדי לשנות סדר.</p>' +
    '<label class="f">מייל לתוצאות</label><input class="field ltr" id="dEmail" type="email" value="' + esc(draft.email) + '" placeholder="name@example.com">' +
    '<p class="err" id="saveErr"></p>' +
    '<button class="btn" data-act="save">שמירת המבחן</button>' +
    '<button class="btn ghost" data-act="toCats">חזרה לבחירת שאלות</button>';
  $('dTitle').oninput = e => { draft.title = e.target.value; $('tbSub').textContent = draftSub(); };
  $('dEmail').oninput = e => { draft.email = e.target.value.trim(); };
}

// גרירה לשינוי סדר. עובד באצבע ובעכבר; גלילה אוטומטית ליד קצה המסך.
function startDrag(e, row) {
  e.preventDefault();
  const list = $('orderList');
  row.classList.add('dragging');
  let lastY = e.clientY, timer = null;
  const place = y => {
    const others = [...list.children].filter(r => r !== row);
    const before = others.find(r => { const b = r.getBoundingClientRect(); return y < b.top + b.height / 2; });
    if (before) list.insertBefore(row, before); else list.appendChild(row);
  };
  const move = ev => { lastY = ev.clientY; place(lastY); };
  timer = setInterval(() => {
    if (lastY < 90) scrollBy(0, -12); else if (lastY > innerHeight - 60) scrollBy(0, 12); else return;
    place(lastY);
  }, 30);
  const up = () => {
    clearInterval(timer);
    removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
    row.classList.remove('dragging');
    draft.items = [...list.children].map(r => r.dataset.key);
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
}
$('panel').addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]');
  if (h) startDrag(e, h.closest('.row'));
});

// סימון פריט. סדר ברירת מחדל: סרטון לפני השאלות שלו, שאלה אחרי הסרטון שלה.
function toggleItem(key) {
  const i = draft.items.indexOf(key);
  if (i > -1) { draft.items.splice(i, 1); return; }
  const id = key.slice(2), vid = key[0] === 'v' ? id : (catalog.questions[id] || {}).video;
  const mine = k => k === 'v:' + vid || (k[0] === 'q' && (catalog.questions[k.slice(2)] || {}).video === vid);
  if (key[0] === 'v') {
    const first = draft.items.findIndex(mine);
    if (first > -1) return draft.items.splice(first, 0, key);
  } else {
    let last = -1; draft.items.forEach((k, j) => { if (mine(k)) last = j; });
    if (last > -1) return draft.items.splice(last + 1, 0, key);
  }
  draft.items.push(key);
}

function startDraft(id) {
  const q = id ? quizzes[id] : null;
  const items = q ? (q.items || []) : [];
  draft = { id: id || null, title: q ? q.title || '' : '', email: q ? q.email || globalEmail : globalEmail,
            items: items.map(it => it.key).filter(Boolean), snap: {} };
  items.forEach(it => { if (it.key) draft.snap[it.key] = it; });
}
function leaveDraft() {
  if (!draft) return true;
  const was = draft.id ? quizzes[draft.id] : null;
  const same = was && JSON.stringify((was.items || []).map(i => i.key)) === JSON.stringify(draft.items) && was.title === draft.title;
  if (!same && (draft.items.length || draft.title) && !confirm('לצאת בלי לשמור את המבחן?')) return false;
  draft = null;
  return true;
}

async function save() {
  const err = m => { $('saveErr').textContent = m; };
  draft.title = $('dTitle').value.trim(); draft.email = $('dEmail').value.trim();
  if (!draft.title) return err('צריך שם למבחן.');
  const items = draft.items.map(itemOf).filter(Boolean);
  if (!items.some(i => i.k === 'q')) return err('צריך לפחות שאלה אחת.');
  if (!validEmail(draft.email)) return err('צריך מייל תקין לתוצאות.');
  const id = draft.id || newId();
  const quiz = { v: 2, title: draft.title, email: draft.email, updated: Date.now(), items };
  try { await api('PUT', '/quizzes/' + id, quiz); } catch (e) { return err('השמירה נכשלה. בדוק אינטרנט ונסה שוב.'); }
  if (!globalEmail) api('PUT', '/settings/resultsEmail', draft.email).then(() => { globalEmail = draft.email; }).catch(() => {});
  quizzes[id] = quiz; draft = null;
  go('tests');
}

// שליחה בלחיצה אחת: קישור אישי חד־פעמי חדש + וואטסאפ עם הטקסט מוכן
async function send(id) {
  const q = quizzes[id];
  if (!(q.items || q.topics || []).length) return alert('המבחן ריק. ערוך אותו קודם.');
  if (!validEmail(q.email || globalEmail)) return alert('אין מייל לתוצאות. ערוך את המבחן והוסף מייל.');
  const code = newCode();
  try { await api('PATCH', '/invites/' + id, { [code]: { created: Date.now(), sent: Date.now() } }); }
  catch (e) { return alert('היצירה נכשלה. בדוק אינטרנט ונסה שוב.'); }
  open('https://wa.me/?text=' + encodeURIComponent(q.title + '\n' + inviteLink(id, code)), '_blank');
}
async function del(id) {
  if (!confirm('למחוק את "' + quizzes[id].title + '"? הקישורים שלו יפסיקו לעבוד, וההגשות שלו יימחקו.')) return;
  try { await api('DELETE', '/quizzes/' + id); } catch (e) { return alert('המחיקה נכשלה. נסה שוב.'); }
  ['/submissions/', '/invites/', '/done/'].forEach(p => api('DELETE', p + id).catch(() => {}));
  delete quizzes[id]; renderTests();
}

async function rename(path, current, label) {
  const name = (prompt(label, current) || '').trim();
  if (!name || name === current) return null;
  try { await api('PATCH', path, { name }); return name; } catch (e) { alert('השמירה נכשלה. נסה שוב.'); return null; }
}
async function addNode(path, label) {
  const name = (prompt(label) || '').trim();
  if (!name) return null;
  const node = { name, order: Date.now() };
  try { await api('PUT', path, node); return node; } catch (e) { alert('השמירה נכשלה. נסה שוב.'); return null; }
}
async function seed() {
  try {
    const data = await (await fetch('catalog.json?v=' + Date.now())).json();
    if (Object.keys(catalog.cats || {}).length) return;
    await api('PUT', '/library/catalog', data);
    catalog = Object.assign({ cats: {}, videos: {}, questions: {} }, data);
    renderCats();
  } catch (e) { alert('הטעינה נכשלה. בדוק אינטרנט ונסה שוב.'); }
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el || !el.dataset.act) return;
  const d = el.dataset;
  switch (d.act) {
    case 'login': {
      $('loginErr').textContent = ''; el.disabled = true;
      try { token = await login($('email').value.trim(), $('pass').value); await load(); }
      catch (err) { $('loginErr').textContent = 'אימייל או סיסמה לא נכונים.'; el.disabled = false; }
      break;
    }
    case 'logout': sessionSet('rt', ''); token = null; draft = null; go('login'); break;
    case 'settings': draft = null; go('cats'); break;
    case 'newTest': startDraft(null); go('cats'); break;
    case 'edit': startDraft(d.id); go('cats'); break;
    case 'send': send(d.id); break;
    case 'delete': del(d.id); break;
    case 'toTests': if (leaveDraft()) go('tests'); break;
    case 'toCats': go('cats'); break;
    case 'toSubs': go('subs'); break;
    case 'openCat': curCat = d.cid; go('subs'); break;
    case 'openSub': curSub = d.sid; go('items'); break;
    case 'toOrder': go('order'); break;
    case 'save': save(); break;
    case 'seed': seed(); break;
    case 'item':
      if (e.target.closest('.preview')) return;   // לחיצה בתוך הנגן/התשובות לא סוגרת
      expanded.has(d.key) ? expanded.delete(d.key) : expanded.add(d.key);
      keepScroll(renderItems); break;
    case 'pick':
      toggleItem(d.key); keepScroll(renderItems); break;
    case 'pickAll':
      videosIn(curCat, curSub).forEach(([vid]) => {
        ['v:' + vid].concat(questionsOf(vid).map(([qid]) => 'q:' + qid))
          .forEach(k => { if (!draft.items.includes(k)) toggleItem(k); });
      });
      renderItems(); break;
    case 'renameCat': {
      const n = await rename('/library/catalog/cats/' + d.cid, catName(d.cid), 'שם הקטגוריה:');
      if (n) { catalog.cats[d.cid].name = n; renderCats(); }
      break;
    }
    case 'renameSub': {
      const n = await rename('/library/catalog/cats/' + curCat + '/subs/' + d.sid, subName(curCat, d.sid), 'שם תת־הקטגוריה:');
      if (n) { catalog.cats[curCat].subs[d.sid].name = n; renderSubs(); }
      break;
    }
    case 'addCat': {
      const cid = 'c' + newId(), node = await addNode('/library/catalog/cats/' + cid, 'שם הקטגוריה החדשה:');
      if (node) { catalog.cats[cid] = node; renderCats(); }
      break;
    }
    case 'addSub': {
      const sid = 's' + newId(), node = await addNode('/library/catalog/cats/' + curCat + '/subs/' + sid, 'שם תת־הקטגוריה החדשה:');
      if (node) { (catalog.cats[curCat].subs = catalog.cats[curCat].subs || {})[sid] = node; renderSubs(); }
      break;
    }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && view === 'login') document.querySelector('[data-act="login"]').click();
  else if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.box.item')) { e.preventDefault(); e.target.click(); }
});
addEventListener('beforeunload', e => { if (draft && draft.items.length) { e.preventDefault(); e.returnValue = ''; } });

go('login');
(async () => {
  if (!sessionGet('rt')) return;
  try { await relogin(); await load(); } catch (e) {}
})();
</script>
